<style>
:root{color-scheme:light;--w:#fff;--y:#FFC72C;--yl:#FFF1C2;--b:#22409A;--g:#1e7e34;--r:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--w);color:var(--b);font-family:'Cairo',Tahoma,Arial,sans-serif;line-height:1.8}
header{background:var(--y);display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:4px solid var(--b)}
header img{width:64px;height:60px;object-fit:contain;background:#fff;border-radius:10px}
header h1{margin:0;font-size:1.1rem}header small{display:block;font-weight:400}
main{max-width:900px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:var(--y);color:var(--b);border:0;border-radius:16px;padding:22px 10px;font:700 1.05rem 'Cairo',sans-serif;cursor:pointer;min-height:110px;box-shadow:0 3px 0 var(--b)}
.card span{display:block;font-size:2rem}
.card:active{transform:translateY(2px)}
.btn{background:var(--b);color:#fff;border:0;border-radius:10px;padding:8px 16px;font:600 .95rem 'Cairo',sans-serif;cursor:pointer}
.btn.alt{background:var(--y);color:var(--b)}
.crumb{margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
h2{margin:8px 0 12px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--b);color:#fff}
th,td{padding:10px;border:1px solid var(--y);text-align:right}
tr:nth-child(even) td{background:var(--yl)}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:12px 0}
.tab{background:var(--yl);color:var(--b);border:2px solid var(--y);border-radius:10px;padding:8px;font:600 .95rem 'Cairo',sans-serif;cursor:pointer}
.tab.on{background:var(--b);color:#fff;border-color:var(--b)}
.empty{background:var(--yl);border:2px dashed var(--y);border-radius:12px;padding:24px;text-align:center}
.box{border:2px solid var(--y);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.box.ok{border-color:var(--g)}.box.bad{border-color:var(--r)}
.opt{display:block;padding:6px 10px;margin:4px 0;border-radius:8px;cursor:pointer;border:1px solid var(--yl)}
.opt.c{background:#e6f4ea}.opt.w{background:#fdecea}
textarea{width:100%;min-height:80px;border:2px solid var(--y);border-radius:8px;padding:8px;font:inherit;color:var(--b)}
.res{background:var(--b);color:#fff;border-radius:12px;padding:14px;text-align:center;font-size:1.15rem;margin:12px 0}
.lt{width:100%;border-collapse:separate;border-spacing:0 10px}.lt td{background:#F2B400;color:var(--b);font-weight:700;font-size:1.1rem;padding:14px 16px;border:0}.lt td:first-child{border-radius:0 12px 12px 0}.lt td:last-child{border-radius:12px 0 0 12px;width:1%;white-space:nowrap}
.hd{background:var(--y);border-radius:8px;padding:2px 12px;font-weight:700;margin-bottom:6px}.lb{display:block;font-weight:700;margin:10px 0 2px}.mini{width:auto;min-width:60%;margin:6px 0}.mini td,.mini th{text-align:center}.ex p{margin:6px 0}.fm{overflow-x:auto;max-width:100%;direction:ltr;text-align:center}.fm mjx-container{margin:6px 0!important}.ex{background:var(--yl);border-radius:10px;padding:8px 12px;margin-top:8px}
.en{direction:ltr;text-align:left}
.content img,.content svg{max-width:100%;height:auto}
</style>
</head>

const SUBJECTS=[
 {name:"رياضيات - 2",en:"Mathematics-2",lectures:[{"title": "قوانين التكامل الأساسية", "titleEn": "Basic Integration Formulas", "explain": "<p>تحت كل قانون مثال بسيط وشرحه باختصار.<br>الحرف <bdi dir=\"ltr\">C</bdi> هو ثابت التكامل.</p><div class=\"en\" style=\"margin-bottom:10px\">C = Constant of Integration</div><div class=\"box law\"><div class=\"hd\">خصائص التكامل غير المحدد</div><span class=\"lb\">التعريف:</span><div class=\"fm\">\\[\\int f(x)dx=F(x)+C\\]</div><span class=\"lb\">التفاضل بيلغي التكامل:</span><div class=\"fm\">\\[\\frac{d}{dx}\\int f(x)dx=f(x)\\]</div><span class=\"lb\">الثابت يطلع برا التكامل:</span><div class=\"fm\">\\[\\int c\\,f(x)dx=c\\int f(x)dx\\]</div><span class=\"lb\">التكامل بيتوزع على الجمع والطرح:</span><div class=\"fm\">\\[\\int[f(x)\\pm g(x)]dx=\\int f(x)dx\\pm\\int g(x)dx\\]</div><p><bdi dir=\"ltr\">F</bdi> هي الدالة اللي مشتقتها <bdi dir=\"ltr\">f</bdi>، والـ <bdi dir=\"ltr\">C</bdi> ثابت التكامل.</p></div><div class=\"box law\"><div class=\"hd\">القانون 1: قانون القوة</div><span class=\"lb\">الصيغة:</span><div class=\"fm\">\\[\\int x^{n}dx=\\frac{x^{n+1}}{n+1}+C,\\quad n\\neq-1\\]</div><div class=\"ex\"><span class=\"lb\">مثال:</span><div class=\"fm\">\\[\\int x^{4}dx=\\frac{x^{5}}{5}+C\\]</div><span class=\"lb\">الشرح:</span><p>نزوّد الأس واحد ونقسم على الأس الجديد.</p></div><div class=\"ex\"><span class=\"lb\">مثال:</span><div class=\"fm\">\\[\\int x^{-2}dx=\\frac{x^{-1}}{-1}+C=-\\frac{1}{x}+C\\]</div><span class=\"lb\">الشرح:</span><p>الأس السالب نفس القانون: <bdi dir=\"ltr\">−2</bdi> تبقى <bdi dir=\"ltr\">−1</bdi> ونقسم على <bdi dir=\"ltr\">−1</bdi>.</p></div><div class=\"ex\"><span class=\"lb\">مثال:</span><div class=\"fm\">\\[\\int\\frac{1}{x^{5}}dx=\\int x^{-5}dx=\\frac{x^{-4}}{-4}+C\\]</div><span class=\"lb\">الشرح:</span><p>نحوّل الكسر لأس سالب الأول.</p></div><div class=\"ex\"><span class=\"lb\">مثال:</span><div class=\"fm\">\\[\\int\\sqrt{x}\\,dx=\\int x^{1/2}dx=\\frac{x^{3/2}}{3/2}+C=\\frac{2}{3}x^{3/2}+C\\]</div><span class=\"lb\">الشرح:</span><p>الجذر هو أس نص، والقسمة على كسر معناها ضرب في مقلوبه.</p></div></div><div class=\"box law\"><div class=\"hd\">القانون 2</div><span class=\"lb\">الصيغة:</span><div class=\"fm\">\\[\\int\\frac{1}{x}dx=\\ln|x|+C\\]</div><div class=\"ex\"><span class=\"lb\">مثال:</span><div class=\"fm\">\\[\\int\\left(16x^{7}-\\sqrt{x}+\\frac{1}{x}\\right)dx=2x^{8}-\\frac{2}{3}x^{3/2}+\\ln|x|+C\\]</div><span class=\"lb\">الشرح:</span><p>نوزّع التكامل على كل حد، والـ <bdi dir=\"ltr\">16</bdi> ثابت يطلع برا، فـ <bdi dir=\"ltr\">16x</bdi>⁸ على <bdi dir=\"ltr\">8</bdi> تبقى <bdi dir=\"ltr\">2x</bdi>⁸.</p></div></div><div class=\"box law\"><div class=\"hd\">القانون 3</div><span class=\"lb\">الصيغة:</span><div class=\"fm\">\\[\\int e^{x}dx=e^{x}+C\\]</div><div class=\"fm\">\\[\\int e^{kx}dx=\\frac{e^{kx}}{k}+C\\]</div><div class=\"ex\"><span class=\"lb\">مثال:</span><div class=\"fm\">\\[\\int e^{3x}dx=\\frac{e^{3x}}{3}+C\\]</div><span class=\"lb\">الشرح:</span><p>نقسم على معامل <bdi dir=\"ltr\">x</bdi> وهو <bdi dir=\"ltr\">3</bdi>.</p></div><div class=\"ex\"><span class=\"lb\">مثال:</span><div class=\"fm\">\\[\\int e^{5x}dx=\\frac{e^{5x}}{5}+C\\]</div><span class=\"lb\">الشرح:</span><p>نقسم على معامل <bdi dir=\"ltr\">x</bdi> وهو <bdi dir=\"ltr\">5</bdi>.</p></div><div class=\"ex\"><span class=\"lb\">مثال:</span><div class=\"fm\">\\[\\int e^{-x}dx=\\frac{e^{-x}}{-1}+C=-e^{-x}+C\\]</div><span class=\"lb\">الشرح:</span><p>معامل <bdi dir=\"ltr\">x</bdi> هو <bdi dir=\"ltr\">−1</bdi> فنقسم على <bdi dir=\"ltr\">−1</bdi>.</p></div></div><div class=\"box law\"><div class=\"hd\">القانون 4</div><span class=\"lb\">الصيغة:</span><div class=\"fm\">\\[\\int a^{x}dx=\\frac{a^{x}}{\\ln a}+C\\]</div><div class=\"fm\">\\[\\int a^{f(x)}f'(x)dx=\\frac{a^{f(x)}}{\\ln a}+C\\]</div><div class=\"ex\"><span class=\"lb\">مثال:</span><div class=\"fm\">\\[\\int 2^{x}dx=\\frac{2^{x}}{\\ln 2}+C\\]</div><span class=\"lb\">الشرح:</span><p>هنا <bdi dir=\"ltr\">a = 2</bdi>، فنقسم على <bdi dir=\"ltr\">ln 2</bdi>.</p></div><div class=\"ex\"><span class=\"lb\">مثال:</span><div class=\"fm\">\\[\\int 2^{x^{2}}\\cdot 2x\\,dx=\\frac{2^{x^{2}}}{\\ln 2}+C\\]</div><span class=\"lb\">الشرح:</span><p><bdi dir=\"ltr\">f = x²</bdi> ومشتقته <bdi dir=\"ltr\">2x</bdi> موجودة جنب الدالة، فنقسم على <bdi dir=\"ltr\">ln 2</bdi>.</p></div></div><div class=\"box law\"><div class=\"hd\">القانون 5: sin</div><span class=\"lb\">الصيغة:</span><div class=\"fm\">\\[\\int\\sin x\\,dx=-\\cos x+C\\]</div><div class=\"fm\">\\[\\int\\sin kx\\,dx=-\\frac{\\cos kx}{k}+C\\]</div><div class=\"fm\">\\[\\int\\sin\\left(f(x)\\right)f'(x)dx=-\\cos f(x)+C\\]</div><div class=\"ex\"><span class=\"lb\">مثال:</span><div class=\"fm\">\\[\\int\\sin 3x\\,dx=-\\frac{\\cos 3x}{3}+C\\]</div><span class=\"lb\">الشرح:</span><p>تكامل <bdi dir=\"ltr\">sin</bdi> سالب <bdi dir=\"ltr\">cos</bdi>، ونقسم على <bdi dir=\"ltr\">3</bdi>.</p></div><div class=\"ex\"><span class=\"lb\">مثال:</span><div class=\"fm\">\\[\\int x\\sin x^{2}dx=\\frac{1}{2}\\int\\sin\\left(x^{2}\\right)2x\\,dx=-\\frac{\\cos x^{2}}{2}+C\\]</div><span class=\"lb\">الشرح:</span><p>مشتقة <bdi dir=\"ltr\">x²</bdi> هي <bdi dir=\"ltr\">2x</bdi>، فنضرب ونقسم على <bdi dir=\"ltr\">2</bdi>.</p></div></div><div class=\"box law\"><div class=\"hd\">القانون 6: cos</div><span class=\"lb\">الصيغة:</span><div class=\"fm\">\\[\\int\\cos x\\,dx=\\sin x+C\\]</div><div class=\"fm\">\\[\\int\\cos kx\\,dx=\\frac{\\sin kx}{k}+C\\]</div><div class=\"fm\">\\[\\int\\cos\\left(f(x)\\right)f'(x)dx=\\sin f(x)+C\\]</div><div class=\"ex\"><span class=\"lb\">مثال:</span><div class=\"fm\">\\[\\int\\cos 6x\\,dx=\\frac{\\sin 6x}{6}+C\\]</div><span class=\"lb\">الشرح:</span><p>تكامل <bdi dir=\"ltr\">cos</bdi> هو <bdi dir=\"ltr\">sin</bdi>، ونقسم على <bdi dir=\"ltr\">6</bdi>.</p></div><div class=\"ex\"><span class=\"lb\">مثال:</span><div class=\"fm\">\\[\\int\\cos\\left(x^{2}\\right)2x\\,dx=\\sin x^{2}+C\\]</div><span class=\"lb\">الشرح:</span><p><bdi dir=\"ltr\">f = x²</bdi> ومشتقته <bdi dir=\"ltr\">2x</bdi> موجودة بالظبط.</p></div></div><span class=\"lb\">للتأكد من الناتج، فاضله:</span><div class=\"fm\">\\[\\frac{d}{dx}\\sin x=\\cos x\\qquad\\frac{d}{dx}\\cos x=-\\sin x\\]</div><div class=\"box law\"><div class=\"hd\">القانون 7</div><span class=\"lb\">الصيغة:</span><div class=\"fm\">\\[\\int\\left(f(x)\\right)^{n}f'(x)dx=\\frac{\\left(f(x)\\right)^{n+1}}{n+1}+C,\\quad n\\neq-1\\]</div><div class=\"ex\"><span class=\"lb\">مثال:</span><div class=\"fm\">\\[\\int\\left(x^{2}+2x\\right)^{3}(2x+2)dx=\\frac{\\left(x^{2}+2x\\right)^{4}}{4}+C\\]</div><span class=\"lb\">الشرح:</span><p><bdi dir=\"ltr\">f = x²+2x</bdi> ومشتقته <bdi dir=\"ltr\">2x+2</bdi> موجودة بالظبط، فنزوّد الأس ونقسم عليه.</p></div><div class=\"ex\"><span class=\"lb\">مثال:</span><div class=\"fm\">\\[\\int\\left(2\\sin x+x^{2}\\right)^{5}(\\cos x+x)dx=\\frac{1}{2}\\cdot\\frac{\\left(2\\sin x+x^{2}\\right)^{6}}{6}=\\frac{\\left(2\\sin x+x^{2}\\right)^{6}}{12}+C\\]</div><span class=\"lb\">الشرح:</span><p>مشتقة <bdi dir=\"ltr\">f</bdi> هي <bdi dir=\"ltr\">2cos x+2x</bdi> يعني <bdi dir=\"ltr\">2</bdi> ضرب <bdi dir=\"ltr\">cos x+x</bdi>، فنضرب ونقسم على <bdi dir=\"ltr\">2</bdi>.</p></div></div><div class=\"box law\"><div class=\"hd\">القانون 8</div><span class=\"lb\">الصيغة:</span><div class=\"fm\">\\[\\int\\frac{f'(x)}{f(x)}dx=\\ln|f(x)|+C\\]</div><div class=\"ex\"><span class=\"lb\">مثال:</span><div class=\"fm\">\\[\\int\\frac{x}{x^{2}+1}dx=\\frac{1}{2}\\ln\\left(x^{2}+1\\right)+C\\]</div><span class=\"lb\">الشرح:</span><p>مشتقة المقام <bdi dir=\"ltr\">2x</bdi>، فنضرب ونقسم على <bdi dir=\"ltr\">2</bdi>.</p></div><div class=\"ex\"><span class=\"lb\">مثال:</span><div class=\"fm\">\\[\\int\\frac{-\\sin x+2e^{2x}}{\\cos x+e^{2x}}dx=\\ln\\left(\\cos x+e^{2x}\\right)+C\\]</div><span class=\"lb\">الشرح:</span><p>البسط هو مشتقة المقام بالظبط: مشتقة <bdi dir=\"ltr\">cos</bdi> هي <bdi dir=\"ltr\">−sin</bdi>، ومشتقة <bdi dir=\"ltr\">e</bdi> أُس <bdi dir=\"ltr\">2x</bdi> هي <bdi dir=\"ltr\">2e</bdi> أُس <bdi dir=\"ltr\">2x</bdi>.</p></div></div><h3 style=\"margin-top:22px\">قاعدة اختيار التفاضل والتكامل</h3><div class=\"en\">Integration by Parts</div><span class=\"lb\">القانون المستخدم:</span><div class=\"fm\">\\[\\int u\\,dv=uv-\\int v\\,du\\]</div><div class=\"box law\"><div class=\"hd\">الحالة الأولى</div><span class=\"lb\">لو عندك:</span><div class=\"fm\">\\[x\\sin x\\ \\ \\text{or}\\ \\ x\\cos x\\ \\ \\text{or}\\ \\ xe^{x}\\]</div><span class=\"lb\">يبقى:</span><table class=\"mini\"><tr><th>الدالة</th><th>نعمل فيها</th></tr><tr><td>\\(x\\)</td><td>تفاضل</td></tr><tr><td>\\(\\sin x\\)</td><td>تكامل</td></tr><tr><td>\\(\\cos x\\)</td><td>تكامل</td></tr><tr><td>\\(e^x\\)</td><td>تكامل</td></tr></table><div class=\"ex\"><span class=\"lb\">مثال:</span><div class=\"fm\">\\[\\int x\\sin x\\,dx\\]</div><span class=\"lb\">الشرح:</span><p>الـ <bdi dir=\"ltr\">x</bdi> نفاضلها، والـ <bdi dir=\"ltr\">sin x</bdi> نكاملها.</p><div class=\"fm\">\\[\\begin{aligned}u&=x & du&=dx\\\\ dv&=\\sin x\\,dx & v&=-\\cos x\\end{aligned}\\]</div><p>نعوض في القانون:</p><div class=\"fm\">\\[=x(-\\cos x)-\\int(-\\cos x)\\,dx\\]</div><span class=\"lb\">الناتج:</span><div class=\"fm\">\\[\\int x\\sin x\\,dx=-x\\cos x+\\sin x+C\\]</div><p>نفس الفكرة مع <bdi dir=\"ltr\">cos x</bdi> و <bdi dir=\"ltr\">e^x</bdi>.</p></div></div><div class=\"box law\"><div class=\"hd\">الحالة الثانية</div><span class=\"lb\">لو عندك:</span><div class=\"fm\">\\[x\\ln x\\]</div><span class=\"lb\">يبقى:</span><table class=\"mini\"><tr><th>الدالة</th><th>نعمل فيها</th></tr><tr><td>\\(x\\)</td><td>تكامل</td></tr><tr><td>\\(\\ln x\\)</td><td>تفاضل</td></tr></table><div class=\"ex\"><span class=\"lb\">مثال:</span><div class=\"fm\">\\[\\int x\\ln x\\,dx\\]</div><span class=\"lb\">الشرح:</span><p>الـ <bdi dir=\"ltr\">ln x</bdi> نفاضلها، والـ <bdi dir=\"ltr\">x</bdi> نكاملها.</p><div class=\"fm\">\\[\\begin{aligned}u&=\\ln x & du&=\\tfrac{1}{x}\\,dx\\\\ dv&=x\\,dx & v&=\\tfrac{x^2}{2}\\end{aligned}\\]</div><p>نعوض في القانون:</p><div class=\"fm\">\\[=\\frac{x^2}{2}\\ln x-\\int\\frac{x}{2}\\,dx\\]</div><span class=\"lb\">الناتج:</span><div class=\"fm\">\\[\\int x\\ln x\\,dx=\\frac{x^2}{2}\\ln x-\\frac{x^2}{4}+C\\]</div></div></div><h3 style=\"margin-top:26px\">طريقة الجدول للتكامل بالأجزاء</h3><div class=\"en\">Tabular Method (DI Method)</div><p>طريقة سريعة بتغنينا عن تكرار قانون <bdi dir=\"ltr\">u dv</bdi> أكتر من مرة، وبتنفع لما تكون دالة زي <bdi dir=\"ltr\">x²</bdi> أو <bdi dir=\"ltr\">x</bdi>³ مضروبة في <bdi dir=\"ltr\">sin</bdi> أو <bdi dir=\"ltr\">cos</bdi> أو <bdi dir=\"ltr\">e</bdi>.</p><div class=\"box law\"><div class=\"hd\">الخطوات</div><ol style=\"margin:6px 0;padding-inline-start:22px\"><li>نرسم جدول فيه عمودين، <bdi dir=\"ltr\">D</bdi> للتفاضل و<bdi dir=\"ltr\">I</bdi> للتكامل، وعمود صغير للإشارات.</li><li>الدالة اللي بتوصل لصفر لما نفاضلها، زي <bdi dir=\"ltr\">x²</bdi>، نحطها في <bdi dir=\"ltr\">D</bdi>.</li><li>الدالة التانية، زي <bdi dir=\"ltr\">sin</bdi> أو <bdi dir=\"ltr\">cos</bdi> أو <bdi dir=\"ltr\">e</bdi>، نحطها في <bdi dir=\"ltr\">I</bdi>.</li><li>نفاضل في <bdi dir=\"ltr\">D</bdi> لحد ما نوصل <bdi dir=\"ltr\">0</bdi>، ونكامل في <bdi dir=\"ltr\">I</bdi> بنفس عدد الصفوف.<<bdi dir=\"ltr\">/li</bdi>><<bdi dir=\"ltr\">li</bdi>>في آخر صف بنكتب علامة تكامل قدام الصفر، وتكامل الصفر بيساوي <bdi dir=\"ltr\">C</bdi>.</li><li>الإشارات بالتبادل: <bdi dir=\"ltr\">+ − + −</bdi></li><li>نضرب بالقُطر، يعني كل عنصر في <bdi dir=\"ltr\">D</bdi> في عنصر <bdi dir=\"ltr\">I</bdi> اللي تحته بسطر، ومعاه إشارة صفه.</li><li>نجمع كل النواتج، والـ <bdi dir=\"ltr\">C</bdi> بتيجي من تكامل الصفر في آخر صف.</li></ol></div><div class=\"box law\"><div class=\"hd\">مثال 1</div><div class=\"fm\">\\[\\int x\\,e^x\\,dx\\]</div><span class=\"lb\">الجدول:</span><div style=\"overflow-x:auto\"><table class=\"mini\" dir=\"ltr\" style=\"min-width:100%\"><tr><th>الإشارة</th><th>D</th><th>I</th><th>الحد الناتج</th></tr><tr><td>\\(+\\)</td><td>\\(x\\)</td><td>\\(e^x\\)</td><td>\\(x\\,e^x\\)</td></tr><tr><td>\\(-\\)</td><td>\\(1\\)</td><td>\\(e^x\\)</td><td>\\(-e^x\\)</td></tr><tr><td>\\(+\\)</td><td>\\(\\int 0\\)</td><td>\\(e^x\\)</td><td>\\(=C\\)</td></tr></table></div><span class=\"lb\">الشرح:</span><p>الـ <bdi dir=\"ltr\">x</bdi> بتوصل لصفر بعد تفاضلتين، فالجدول قصير.</p><span class=\"lb\">الناتج:</span><div class=\"fm\">\\[\\int x\\,e^x\\,dx=x\\,e^x-e^x+C\\]</div></div><div class=\"box law\"><div class=\"hd\">مثال 2</div><div class=\"fm\">\\[\\int x^2\\sin 2x\\,dx\\]</div><span class=\"lb\">الجدول:</span><div style=\"overflow-x:auto\"><table class=\"mini\" dir=\"ltr\" style=\"min-width:100%\"><tr><th>الإشارة</th><th>D</th><th>I</th><th>الحد الناتج</th></tr><tr><td>\\(+\\)</td><td>\\(x^2\\)</td><td>\\(\\sin 2x\\)</td><td>\\(-\\frac{x^2}{2}\\cos 2x\\)</td></tr><tr><td>\\(-\\)</td><td>\\(2x\\)</td><td>\\(-\\frac{\\cos 2x}{2}\\)</td><td>\\(+\\frac{x}{2}\\sin 2x\\)</td></tr><tr><td>\\(+\\)</td><td>\\(2\\)</td><td>\\(-\\frac{\\sin 2x}{4}\\)</td><td>\\(+\\frac{1}{4}\\cos 2x\\)</td></tr><tr><td>\\(-\\)</td><td>\\(\\int 0\\)</td><td>\\(\\frac{\\cos 2x}{8}\\)</td><td>\\(=C\\)</td></tr></table></div><span class=\"lb\">الشرح:</span><p>كل سطر في <bdi dir=\"ltr\">I</bdi> بنكامل اللي فوقه، وفي الآخر بنضرب بالقطر ونجمع.</p><span class=\"lb\">الناتج:</span><div class=\"fm\">\\[\\int x^2\\sin 2x\\,dx=-\\frac{x^2}{2}\\cos 2x+\\frac{x}{2}\\sin 2x+\\frac{1}{4}\\cos 2x+C\\]</div></div><div class=\"box law\"><div class=\"hd\">مثال 3</div><div class=\"fm\">\\[\\int x^3 e^{2x}\\,dx\\]</div><span class=\"lb\">الجدول:</span><div style=\"overflow-x:auto\"><table class=\"mini\" dir=\"ltr\" style=\"min-width:100%\"><tr><th>الإشارة</th><th>D</th><th>I</th><th>الحد الناتج</th></tr><tr><td>\\(+\\)</td><td>\\(x^3\\)</td><td>\\(e^{2x}\\)</td><td>\\(\\frac{x^3}{2}e^{2x}\\)</td></tr><tr><td>\\(-\\)</td><td>\\(3x^2\\)</td><td>\\(\\frac{e^{2x}}{2}\\)</td><td>\\(-\\frac{3x^2}{4}e^{2x}\\)</td></tr><tr><td>\\(+\\)</td><td>\\(6x\\)</td><td>\\(\\frac{e^{2x}}{4}\\)</td><td>\\(+\\frac{3x}{4}e^{2x}\\)</td></tr><tr><td>\\(-\\)</td><td>\\(6\\)</td><td>\\(\\frac{e^{2x}}{8}\\)</td><td>\\(-\\frac{3}{8}e^{2x}\\)</td></tr><tr><td>\\(+\\)</td><td>\\(\\int 0\\)</td><td>\\(\\frac{e^{2x}}{16}\\)</td><td>\\(=C\\)</td></tr></table></div><span class=\"lb\">الشرح:</span><p>هنا <bdi dir=\"ltr\">D</bdi> محتاج <bdi dir=\"ltr\">4</bdi> تفاضلات لحد ما يوصل <bdi dir=\"ltr\">0</bdi>، فالجدول أطول. وكل تكامل لـ <bdi dir=\"ltr\">e^2x</bdi> بيقسم على <bdi dir=\"ltr\">2</bdi> زيادة.</p><span class=\"lb\">الناتج:</span><div class=\"fm\">\\[\\int x^3 e^{2x}\\,dx=e^{2x}\\left(\\frac{x^3}{2}-\\frac{3x^2}{4}+\\frac{3x}{4}-\\frac{3}{8}\\right)+C\\]</div></div><div class=\"box law\"><div class=\"hd\">ملحوظة</div><p>الطريقة دي بتنفع لما <bdi dir=\"ltr\">D</bdi> يوصل لصفر. مع <bdi dir=\"ltr\">ln x</bdi> مش هتوصل لصفر، فنستخدم قانون <bdi dir=\"ltr\">u dv</bdi> العادي.</p></div>", "homework": {"mcq": [{"q": "Evaluate \\(\\displaystyle\\int xe^{x}\\,dx\\)", "o": ["\\(xe^{x}+C\\)", "\\(xe^{x}-e^{x}+C\\)", "\\(e^{x}(x+1)+C\\)", "\\(\\frac{x^{2}}{2}e^{x}+C\\)"], "a": 1, "e": "الـ <bdi dir=\"ltr\">x</bdi> نفاضلها والـ <bdi dir=\"ltr\">e</bdi> نكاملها، وبعدين قانون <bdi dir=\"ltr\">u dv</bdi>.<div class=\"fm\">\\[\\int xe^{x}dx=xe^{x}-\\int e^{x}dx=xe^{x}-e^{x}+C\\]</div>"}, {"q": "Evaluate \\(\\displaystyle\\int x\\sin x\\,dx\\)", "o": ["\\(-x\\cos x+\\sin x+C\\)", "\\(x\\cos x-\\sin x+C\\)", "\\(-x\\cos x-\\sin x+C\\)", "\\(x\\sin x+\\cos x+C\\)"], "a": 0, "e": "تكامل <bdi dir=\"ltr\">sin</bdi> بيدي سالب <bdi dir=\"ltr\">cos</bdi>.<div class=\"fm\">\\[\\int x\\sin x\\,dx=-x\\cos x+\\int\\cos x\\,dx=-x\\cos x+\\sin x+C\\]</div>"}, {"q": "Evaluate \\(\\displaystyle\\int x\\cos x\\,dx\\)", "o": ["\\(x\\sin x-\\cos x+C\\)", "\\(-x\\sin x+\\cos x+C\\)", "\\(x\\sin x+\\cos x+C\\)", "\\(x\\cos x+\\sin x+C\\)"], "a": 2, "e": "تكامل <bdi dir=\"ltr\">cos</bdi> بيدي <bdi dir=\"ltr\">sin</bdi>، وبعدها تكامل <bdi dir=\"ltr\">sin</bdi> بيدي سالب <bdi dir=\"ltr\">cos</bdi>.<div class=\"fm\">\\[\\int x\\cos x\\,dx=x\\sin x-\\i power.</p><div class=\"fm\">\\[=16\\cdot\\frac{x^{8}}{8}-\\frac{x^{3/2}}{3/2}+\\ln|x|+C=2x^{8}-\\frac{2}{3}x^{3/2}+\\ln|x|+C\\]</div>"}, {"q": "Evaluate: (a) \\(\\displaystyle\\int\\frac{e^{x}}{e^{x}+5}dx\\)  (b) \\(\\displaystyle\\int x\\left(x^{2}+1\\right)^{3}dx\\)", "a": "<div class=\"fm\">\\[\\text{(a)}\\ \\ln\\left(e^{x}+5\\right)+C\\]</div><p>(b) f = x² + 1, f′ = 2x, so multiply and divide by 2:</p><div class=\"fm\">\\[\\frac{1}{2}\\int 2x\\left(x^{2}+1\\right)^{3}dx=\\frac{\\left(x^{2}+1\\right)^{4}}{8}+C\\]</div>"}]}}]},

 {name:"تحليل وتصميم نظم - 1",en:"Systems Analysis & Design",lectures:[{"title": "النظم والأدوار ومنهجيات التطوير", "titleEn": "Systems, Roles, and Development Methodologies", "explain": "<div class=\"box law\"><div class=\"hd\">معلومات المادة</div><div class=\"en\" style=\"margin-bottom:4px;opacity:.85\">Course Info · ص 1 لـ 10</div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">System Analysis & Design · Code: IS201 · Credit hours: 3 · Lecture: 2 · Labs: 2</div><p style=\"margin:4px 0\">المادة اسمها تحليل وتصميم النظم، كودها <bdi dir=\"ltr\">IS201</bdi>، وهي <bdi dir=\"ltr\">3</bdi> ساعات معتمدة: محاضرة <bdi dir=\"ltr\">2</bdi> ومعمل <bdi dir=\"ltr\">2</bdi>. الدكتورة ولاء عبد العال فرج.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Evaluation: Assignment 10 · Practical exam 10 · Mid Term 20 · Final Exam 60</div><p style=\"margin:4px 0\">توزيع الدرجات: تكليفات <bdi dir=\"ltr\">10</bdi>، عملي <bdi dir=\"ltr\">10</bdi>، ميدتيرم <bdi dir=\"ltr\">20</bdi>، والفاينل <bdi dir=\"ltr\">60</bdi>. يعني الفاينل أهم حاجة.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Outlines: Introduction · Software development methodologies · Requirement Elicitation · Process model using DFD · Object oriented model using UML · Waterfall phased approach</div><p style=\"margin:4px 0\">محاور المادة: مقدمة، منهجيات تطوير البرمجيات، استنباط المتطلبات، نموذج العمليات بـ <bdi dir=\"ltr\">DFD</bdi>، النموذج كائني التوجه بـ <bdi dir=\"ltr\">UML</bdi>، ومنهج <bdi dir=\"ltr\">Waterfall</bdi> المرحلي.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Objectives: study System Analysis and Design methods to analyze and model an information system, then design, model and prototype a new system that meets user needs.</div><p style=\"margin:4px 0\">الهدف إننا نتعلم طرق تحليل وتصميم النظم ونطبقها على نظام معلومات لشركة أو مؤسسة، ونصمم نموذج أولي لنظام جديد يلبّي احتياج المستخدم.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Reference: Bruegge & Dutoit (3rd ed) · Kendall & Kendall (8th ed) · Valacich & George (9th ed)</div><p style=\"margin:4px 0\">المراجع التلاتة: كتاب <bdi dir=\"ltr\">Object</bdi>-<bdi dir=\"ltr\">Oriented Software Engineering</bdi> بالـ <bdi dir=\"ltr\">UML</bdi>، وكتاب <bdi dir=\"ltr\">Kendall</bdi>، وكتاب <bdi dir=\"ltr\">Modern Systems Analysis and Design</bdi>.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Practical lab: MS-Project · DFD · UML</div><p style=\"margin:4px 0\">المعمل بنشتغل فيه على <bdi dir=\"ltr\">MS Project</bdi> و<bdi dir=\"ltr\">DFD</bdi> و<bdi dir=\"ltr\">UML</bdi>.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Lecture Protocol: ask anytime, do not talk to your colleague, soft copy of slides available, if you miss a lecture learn from friends, TAs or the doctor.</div><p style=\"margin:4px 0\">تعليمات المحاضرة: اسأل في أي وقت، ما تتكلمش مع زميلك، السلايدات هتتوفر، ولو فاتتك محاضرة اسأل زمايلك أو المعيدين أو الدكتورة.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Warning: collaboration in study groups is encouraged, but copying or slightly changing others solutions is cheating. Assignment/Project: both get 0. Midterm/Final: both get F.</div><p style=\"margin:4px 0\">تحذير: المذاكرة مع بعض مشجّعة، لكن نسخ الحلول أو الكود حتى لو غيّرت فيه شوية يتحسب غش. في التكليف والمشروع الاتنين ياخدوا صفر، وفي الميدتيرم والفاينل الاتنين ياخدوا <bdi dir=\"ltr\">F</bdi>.</p></div></div><div class=\"box law\"><div class=\"hd\">الفصل الأول</div><div class=\"en\" style=\"margin-bottom:4px;opacity:.85\">Systems, Roles, and Development Methodologies · ص 11 و 12</div><p>الفصل ده بتاع <bdi dir=\"ltr\">Kendall</bdi> & <bdi dir=\"ltr\">Kendall</bdi>، الطبعة الثامنة. وفيه <bdi dir=\"ltr\">4</bdi> حاجات:</p><ul style=\"margin:4px 0;padding-inline-start:22px\"><li><bdi dir=\"ltr\">Information system</bdi>: نظام المعلومات</li><li><bdi dir=\"ltr\">Information system types</bdi>: أنواعه</li><li><bdi dir=\"ltr\">Information Systems Roles</bdi>: أدوار الناس اللي بتشتغل عليه</li><li><bdi dir=\"ltr\">Waterfall methodology</bdi>: منهجية الشلال</li></ul></div><div class=\"box law\"><div class=\"hd\">نظام المعلومات</div><div class=\"en\" style=\"margin-bottom:4px;opacity:.85\">Information System · ص 13</div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Information Systems were automations of well-defined processes.</div><p style=\"margin:4px 0\">نظام المعلومات معناه إننا ناخد شغل ليه خطوات واضحة ومحددة، ونخلّي الكمبيوتر يعمله بدل ما يتعمل باليد.</p></div><div class=\"ex\" style=\"margin-top:6px\">💡 زي نظام تسجيل الطلبة: بدل الورق والطوابير، الخطوات متحددة والنظام بينفذها.</div><span class=\"lb\">أجزاؤه Their parts are:</span><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Software</div><p style=\"margin:4px 0\">البرامج اللي بتشغّل النظام.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Networks</div><p style=\"margin:4px 0\">الشبكات اللي بتوصّل الأجهزة ببعض.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">People</div><p style=\"margin:4px 0\">الناس اللي بتستخدم النظام وبتشغّله.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Hardware</div><p style=\"margin:4px 0\">الأجهزة نفسها، زي الكمبيوتر والسيرفر والطابعة.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Procedures</div><p style=\"margin:4px 0\">الخطوات والقواعد اللي الناس بتمشي عليها وهي بتستخدم النظام.</p></div><div style=\"background:#22409A;color:#fff;border-radius:10px;padding:8px 12px;margin-top:8px\"><b>ببساطة:</b> نظام المعلومات هو خمس حاجات شغالين مع بعض: برامج وشبكات وناس وأجهزة وإجراءات.</div></div><div class=\"box law\"><div class=\"hd\">أنواع نظم المعلومات</div><div class=\"en\" style=\"margin-bottom:4px;opacity:.85\">Information System Types · ص 14</div><p>نظم المعلومات بتتقسم <bdi dir=\"ltr\">3</bdi> أنواع حسب مين بيستخدمها:</p><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Personal IS – improves the productivity of individual users</div><p style=\"margin:4px 0\">نظام شخصي: بيزوّد إنتاجية مستخدم واحد.</p></div><div class=\"ex\" style=\"margin-top:6px\">💡 زي برنامج <bdi dir=\"ltr\">Excel</bdi> أو تطبيق ملاحظات على موبايلك.</div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Group IS – improves communications and supports collaboration among members of a workgroup</div><p style=\"margin:4px 0\">نظام مجموعة: بيحسّن التواصل وبيدعم التعاون بين أعضاء فريق شغل واحد.</p></div><div class=\"ex\" style=\"margin-top:6px\">💡 زي مجموعة بتشتغل على ملف مشترك على <bdi dir=\"ltr\">Google Drive</bdi> أو على <bdi dir=\"ltr\">Teams</bdi>.</div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Enterprise IS – organizations use it to define structured interactions among employees and/or external customers, suppliers, government agencies, etc.</div><p style=\"margin:4px 0\">نظام مؤسسة: المؤسسة بتستخدمه عشان تنظّم التعامل بين موظفيها وبين العملاء والموردين والجهات الحكومية.</p></div><div class=\"ex\" style=\"margin-top:6px\">💡 زي نظام البنك أو نظام الجامعة كلها.</div><div style=\"background:#22409A;color:#fff;border-radius:10px;padding:8px 12px;margin-top:8px\"><b>ببساطة:</b> شخصي لفرد، مجموعة لفريق، ومؤسسة للشركة كلها وأطرافها الخارجية.</div></div><div class=\"box law\"><div class=\"hd\">التصنيف حسب المستوى الإداري</div><div class=\"en\" style=\"margin-bottom:4px;opacity:.85\">Information system classifications in spot of managerial level · ص 15</div><p>الأنظمة بتتوزع على هرم من <bdi dir=\"ltr\">4</bdi> مستويات. كل ما نطلع لفوق القرارات بتبقى أكبر وأهم.</p><div style=\"overflow-x:auto\"><svg viewBox=\"0 0 340 220\" width=\"100%\" style=\"max-width:420px;display:block;margin:auto\" font-family=\"Cairo,Arial,sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"#22409A\">\n<polygon points=\"170,8 128,58 212,58\" fill=\"#E6A800\"/><text x=\"170\" y=\"48\" font-size=\"9\">Strategic</text>\n<polygon points=\"128,58 212,58 252,108 88,108\" fill=\"#FFC72C\"/><text x=\"170\" y=\"88\">Higher</text>\n<polygon points=\"88,108 252,108 292,158 48,158\" fill=\"#FFE08A\"/><text x=\"170\" y=\"138\">Knowledge</text>\n<polygon points=\"48,158 292,158 332,208 8,208\" fill=\"#FFF1C2\" stroke=\"#E6A800\"/><text x=\"170\" y=\"188\">Operational</text></svg></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Operational Level: Transaction Processing Systems TPS</div><p style=\"margin:4px 0\">القاعدة. بتسجّل العمليات اليومية، زي فاتورة أو عملية بيع.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Knowledge Level: Knowledge Work Systems KWS, Office Automation Systems OAS</div><p style=\"margin:4px 0\">مستوى المعرفة. بيساعد الموظفين على شغل المعرفة والمكاتب.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Higher Level: Expert Systems, Decision Support Systems DSS, Management Information Systems MIS</div><p style=\"margin:4px 0\">المستوى الأعلى. بيدعم الإدارة في اتخاذ القرارات.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Strategic Level: ESS, GDSS, CSCWS</div><p style=\"margin:4px 0\">القمة. للإدارة العليا والقرارات الاستراتيجية.</p></div><span class=\"lb\">الاختصارات:</span><ul style=\"margin:4px 0;padding-inline-start:22px\"><li><bdi dir=\"ltr\">ESS</bdi>: <bdi dir=\"ltr\">Executive Support Systems</bdi></li><li><bdi dir=\"ltr\">GDSS</bdi>: <bdi dir=\"ltr\">Group Decision Support Systems</bdi></li><li><bdi dir=\"ltr\">CSCWS</bdi>: <bdi dir=\"ltr\">Computer</bdi>-<bdi dir=\"ltr\">Supported Collaborative Work Systems</bdi></li></ul><div style=\"background:#22409A;color:#fff;border-radius:10px;padding:8px 12px;margin-top:8px\"><b>ببساطة:</b> الهرم من تحت لفوق: <bdi dir=\"ltr\">Operational</bdi> ثم <bdi dir=\"ltr\">Knowledge</bdi> ثم <bdi dir=\"ltr\">Higher</bdi> ثم <bdi dir=\"ltr\">Strategic</bdi>.</div></div><div class=\"box law\"><div class=\"hd\">دمج التقنيات الجديدة</div><div class=\"en\" style=\"margin-bottom:4px;opacity:.85\">Integrating New Technologies into Traditional information systems · ص 16</div><p>التقنيات الحديثة بتدخل جوه نظم المعلومات التقليدية، وعشان كده الحاجة لتحليل وتصميم النظم بتزيد.</p><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Ecommerce and Web Systems</div><p style=\"margin:4px 0\">التجارة الإلكترونية والويب.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Enterprise Resource Planning Systems</div><p style=\"margin:4px 0\">نظم تخطيط موارد المؤسسة <bdi dir=\"ltr\">ERP</bdi>: بتجمع شغل المؤسسة كله في نظام واحد.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Wireless and Mobile Systems</div><p style=\"margin:4px 0\">النظم اللاسلكية والموبايل.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Open Source Software</div><p style=\"margin:4px 0\">البرامج مفتوحة المصدر.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Need for Systems Analysis and Design</div><p style=\"margin:4px 0\">وكل ده بيزوّد احتياجنا لتحليل وتصميم النظم.</p></div></div><div class=\"box law\"><div class=\"hd\">⭐ أدوار نظم المعلومات</div><div class=\"en\" style=\"margin-bottom:4px;opacity:.85\">Information Systems Roles · ص 17</div><p>الأدوار <bdi dir=\"ltr\">5</bdi>. احفظهم بالترتيب ده:</p><ol class=\"en\" style=\"margin:4px 0\"><li>Business analyst</li><li>System analyst</li><li>Infrastructure analyst</li><li>Change management analyst</li><li>Project manager</li></ol></div><div class=\"box law\"><div class=\"hd\">⭐ جدول الأدوار والمسؤوليات</div><div class=\"en\" style=\"margin-bottom:4px;opacity:.85\">Information Systems Roles: Role and Responsibilities · ص 18</div><p>الصفحة دي أهم صفحة في المحاضرة. لكل دور مسؤوليات بتتحفظ:</p><div style=\"border:2px solid #FFC72C;border-radius:10px;padding:8px 12px;margin:10px 0\"><div class=\"en\" style=\"font-size:1.05rem\"><b>Business analyst</b> · محلل الأعمال</div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Analyzing the key business aspects of the system</div><p style=\"margin:4px 0\">بيحلل الجوانب الأساسية للبيزنس في النظام.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Identifying how the system will provide business value</div><p style=\"margin:4px 0\">بيحدد النظام هيفيد البيزنس بإيه، يعني قيمته.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Designing the new business processes and policies</div><p style=\"margin:4px 0\">بيصمم عمليات وسياسات البيزنس الجديدة.</p></div><div style=\"background:#22409A;color:#fff;border-radius:10px;padding:8px 12px;margin-top:8px\"><b>ببساطة:</b> شغله البيزنس: القيمة والسياسات.</div></div><div style=\"border:2px solid #FFC72C;border-radius:10px;padding:8px 12px;margin:10px 0\"><div class=\"en\" style=\"font-size:1.05rem\"><b>Systems analyst</b> · محلل النظم</div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Identifying how technology can improve business processes</div><p style=\"margin:4px 0\">بيحدد التكنولوجيا هتحسّن العمليات إزاي.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Designing the new business processes</div><p style=\"margin:4px 0\">بيصمم العمليات الجديدة.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Designing the information system</div><p style=\"margin:4px 0\">بيصمم نظام المعلومات نفسه.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Ensuring that the system conforms to information systems standards</div><p style=\"margin:4px 0\">بيتأكد إن النظام ماشي على معايير نظم المعلومات.</p></div><div style=\"background:#22409A;color:#fff;border-radius:10px;padding:8px 12px;margin-top:8px\"><b>ببساطة:</b> شغله التكنولوجيا والتصميم ومعايير نظم المعلومات.</div></div><div style=\"border:2px solid #FFC72C;border-radius:10px;padding:8px 12px;margin:10px 0\"><div class=\"en\" style=\"font-size:1.05rem\"><b>Infrastructure analyst</b> · محلل البنية التحتية</div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Identifying infrastructure changes needed to support the system</div><p style=\"margin:4px 0\">بيحدد تغييرات البنية التحتية اللازمة عشان النظام يشتغل.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Ensuring the system conforms to infrastructure standards</div><p style=\"margin:4px 0\">بيتأكد إن النظام ماشي على معايير البنية التحتية.</p></div><div style=\"background:#22409A;color:#fff;border-radius:10px;padding:8px 12px;margin-top:8px\"><b>ببساطة:</b> شغله البنية التحتية ومعاييرها.</div></div><div style=\"border:2px solid #FFC72C;border-radius:10px;padding:8px 12px;margin:10px 0\"><div class=\"en\" style=\"font-size:1.05rem\"><b>Change management analyst</b> · محلل إدارة التغيير</div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Developing and executing a change management plan</div><p style=\"margin:4px 0\">بيعمل وينفّذ خطة إدارة التغيير.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Developing and executing a user training plan</div><p style=\"margin:4px 0\">بيعمل وينفّذ خطة تدريب المستخدمين.</p></div><div style=\"background:#22409A;color:#fff;border-radius:10px;padding:8px 12px;margin-top:8px\"><b>ببساطة:</b> شغله التغيير وتدريب الناس.</div></div><div style=\"border:2px solid #FFC72C;border-radius:10px;padding:8px 12px;margin:10px 0\"><div class=\"en\" style=\"font-size:1.05rem\"><b>Project manager</b> · مدير المشروع</div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Managing the team of analysts, programmers, technical writers, and other specialists</div><p style=\"margin:4px 0\">بيدير فريق المحللين والمبرمجين والكُتّاب التقنيين وباقي المتخصصين.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Developing and monitoring the project plan</div><p style=\"margin:4px 0\">بيعمل خطة المشروع ويتابعها.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Assigning resources</div><p style=\"margin:4px 0\">بيوزّع الموارد.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Serving as the primary point of contact for the project</div><p style=\"margin:4px 0\">هو نقطة الاتصال الأساسية للمشروع.</p></div><div style=\"background:#22409A;color:#fff;border-radius:10px;padding:8px 12px;margin-top:8px\"><b>ببساطة:</b> شغله الفريق والخطة والموارد.</div></div></div><div class=\"box law\"><div class=\"hd\">دورة حياة تطوير النظم</div><div class=\"en\" style=\"margin-bottom:4px;opacity:.85\">Systems Development Life Cycle SDLC · ص 19 و 20</div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">The systems development life cycle is a phased approach to solving business problems.</div><p style=\"margin:4px 0\"><bdi dir=\"ltr\">SDLC</bdi> طريقة بنحل بيها مشاكل البيزنس على مراحل، مش مرة واحدة.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Developed through the use of a specific cycle of analyst and user activities.</div><p style=\"margin:4px 0\">بتتنفذ من خلال دورة محددة من أنشطة المحلل والمستخدم.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Each phase has unique user activities.</div><p style=\"margin:4px 0\">كل مرحلة ليها أنشطة خاصة بيها.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">It is also known waterfall SDLC</div><p style=\"margin:4px 0\">وبتتسمى كمان <bdi dir=\"ltr\">Waterfall</bdi>، يعني الشلال.</p></div><div class=\"ex\" style=\"margin-top:6px\">💡 زي بناء بيت: تخطيط، ثم رسم، ثم تصميم، ثم بناء، ثم صيانة.</div><div style=\"overflow-x:auto\"><svg viewBox=\"0 0 360 240\" width=\"100%\" style=\"max-width:440px;display:block;margin:auto\" font-family=\"Cairo,Arial,sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"#22409A\">\n<defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#22409A\"/></marker></defs>\n<g fill=\"#FFC72C\" stroke=\"#22409A\"><rect x=\"140\" y=\"8\" width=\"80\" height=\"30\" rx=\"5\"/><rect x=\"262\" y=\"75\" width=\"86\" height=\"30\" rx=\"5\"/><rect x=\"215\" y=\"180\" width=\"80\" height=\"30\" rx=\"5\"/><rect x=\"65\" y=\"180\" width=\"95\" height=\"30\" rx=\"5\"/><rect x=\"10\" y=\"75\" width=\"86\" height=\"30\" rx=\"5\"/></g>\n<g stroke=\"#22409A\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#ar)\"><path d=\"M220 25 L300 72\"/><path d=\"M310 108 L270 177\"/><path d=\"M215 195 L163 195\"/><path d=\"M85 177 L50 108\"/><path d=\"M52 72 L138 25\"/></g>\n<g stroke=\"none\"><text x=\"180\" y=\"28\">1 Planning</text><text x=\"305\" y=\"95\">2 Analysis</text><text x=\"255\" y=\"200\">3 Design</text><text x=\"112\" y=\"200\">4 Implementation</text><text x=\"53\" y=\"95\">5 Maintenance</text></g></svg></div><div style=\"background:#22409A;color:#fff;border-radius:10px;padding:8px 12px;margin-top:8px\"><b>ببساطة:</b> <bdi dir=\"ltr\">5</bdi> مراحل بالترتيب: <bdi dir=\"ltr\">Planning</bdi> ثم <bdi dir=\"ltr\">Analysis</bdi> ثم <bdi dir=\"ltr\">Design</bdi> ثم <bdi dir=\"ltr\">Implementation</bdi> ثم <bdi dir=\"ltr\">Maintenance</bdi>.</div></div><div class=\"box law\"><div class=\"hd\">1) التخطيط</div><div class=\"en\" style=\"margin-bottom:4px;opacity:.85\">Planning phase: Identifying Problems, Opportunities, and Objectives · ص 21</div><p>في المرحلة دي بنحدد المشكلة والفرصة والهدف من المشروع.</p><span class=\"lb\">الأنشطة Activity:</span><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Interviewing user management</div><p style=\"margin:4px 0\">بنقابل إدارة المستخدمين ونسمع منهم.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Summarizing the knowledge obtained</div><p style=\"margin:4px 0\">بنلخّص اللي عرفناه.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Estimating the scope of the project</div><p style=\"margin:4px 0\">بنقدّر حجم المشروع.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Documenting the results</div><p style=\"margin:4px 0\">بنوثّق النتايج.</p></div><span class=\"lb\">الناتج Output:</span><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Feasibility report containing problem definition and objective summaries from which management can make a decision on whether to proceed with the proposed project</div><p style=\"margin:4px 0\">تقرير جدوى فيه تعريف المشكلة وملخص الأهداف، والإدارة بتقرر منه تكمّل في المشروع ولا لأ.</p></div><div style=\"background:#22409A;color:#fff;border-radius:10px;padding:8px 12px;margin-top:8px\"><b>ببساطة:</b> الناتج تقرير جدوى، والإدارة تقرر.</div></div><div class=\"box law\"><div class=\"hd\">2) التحليل: متطلبات المستخدمين</div><div class=\"en\" style=\"margin-bottom:4px;opacity:.85\">Analysis phase: Determining Human Information Requirements · ص 22</div><p>هنا بنفهم المستخدمين محتاجين إيه بالظبط.</p><span class=\"lb\">الأنشطة Activity:</span><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Interviewing</div><p style=\"margin:4px 0\">مقابلات.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Sampling and investigating hard data</div><p style=\"margin:4px 0\">بناخد عينات ونفحص البيانات الفعلية.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Questionnaires</div><p style=\"margin:4px 0\">استبيانات.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Observe the decision maker's behavior and environment</div><p style=\"margin:4px 0\">بنراقب سلوك متخذ القرار وبيئة شغله.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Prototyping</div><p style=\"margin:4px 0\">بنعمل نماذج أولية.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Learn the who, what, where, when, how, and why of the current system</div><p style=\"margin:4px 0\">بنفهم النظام الحالي: مين وإيه وفين ومتى وإزاي وليه.</p></div><span class=\"lb\">الناتج Output:</span><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">The analyst understands how users accomplish their work when interacting with a computer, and begins to know how to make the new system more useful and usable.</div><p style=\"margin:4px 0\">المحلل يفهم المستخدمين بيشتغلوا إزاي مع الكمبيوتر، ويبدأ يعرف يخلّي النظام الجديد أنفع وأسهل.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">The analyst should also know the business functions and have complete information on the people, goals, data, and procedure involved.</div><p style=\"margin:4px 0\">ولازم يعرف وظائف البيزنس ويبقى معاه معلومات كاملة عن الناس والأهداف والبيانات والإجراءات.</p></div><div style=\"background:#22409A;color:#fff;border-radius:10px;padding:8px 12px;margin-top:8px\"><b>ببساطة:</b> بنجمع المعلومات بأكتر من طريقة عشان نفهم النظام الحالي.</div></div><div class=\"box law\"><div class=\"hd\">3) التحليل: احتياجات النظام</div><div class=\"en\" style=\"margin-bottom:4px;opacity:.85\">Analysis phase: Analyzing System Needs · ص 23</div><p>بنحلل اللي جمعناه ونحدد النظام محتاج إيه.</p><span class=\"lb\">الأنشطة Activity:</span><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Create data flow, activity, or sequence diagrams</div><p style=\"margin:4px 0\">بنرسم مخططات تدفق البيانات والأنشطة والتسلسل.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Complete the data dictionary</div><p style=\"margin:4px 0\">بنكمّل قاموس البيانات.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Analyze the structured decisions made</div><p style=\"margin:4px 0\">بنحلل القرارات المهيكلة.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Prepare and present the system proposal</div><p style=\"margin:4px 0\">بنجهّز ونعرض مقترح النظام.</p></div><span class=\"lb\">الناتج Output:</span><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Recommendation on what, if anything, should be done</div><p style=\"margin:4px 0\">توصية بالمطلوب عمله، لو في حاجة تتعمل.</p></div><div style=\"background:#22409A;color:#fff;border-radius:10px;padding:8px 12px;margin-top:8px\"><b>ببساطة:</b> بنرسم ونحلل، وفي الآخر بنقدّم توصية.</div></div><div class=\"box law\"><div class=\"hd\">4) التصميم</div><div class=\"en\" style=\"margin-bottom:4px;opacity:.85\">Design phase: Designing the Recommended System · ص 24</div><p>هنا بنصمم النظام اللي اتوصينا بيه.</p><span class=\"lb\">الأنشطة Activity:</span><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Design procedures for data entry</div><p style=\"margin:4px 0\">بنصمم إجراءات إدخال البيانات.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Design the human-computer interface</div><p style=\"margin:4px 0\">بنصمم واجهة المستخدم.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Design system controls</div><p style=\"margin:4px 0\">بنصمم ضوابط النظام.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Design database and/or files</div><p style=\"margin:4px 0\">بنصمم قاعدة البيانات أو الملفات.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Design backup procedures</div><p style=\"margin:4px 0\">بنصمم إجراءات النسخ الاحتياطي.</p></div><span class=\"lb\">الناتج Output:</span><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Model of the actual system</div><p style=\"margin:4px 0\">نموذج للنظام الفعلي.</p></div><div style=\"background:#22409A;color:#fff;border-radius:10px;padding:8px 12px;margin-top:8px\"><b>ببساطة:</b> بنرسم شكل النظام قبل ما نبنيه.</div></div><div class=\"box law\"><div class=\"hd\">5) التنفيذ: تطوير البرمجيات وتوثيقها</div><div class=\"en\" style=\"margin-bottom:4px;opacity:.85\">Implementation phase: Developing and Documenting Software · ص 25</div><p>هنا النظام بيتبني فعلًا.</p><span class=\"lb\">الأنشطة Activity:</span><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">System analyst works with programmers to develop any original software</div><p style=\"margin:4px 0\">المحلل بيشتغل مع المبرمجين على أي برامج أصلية.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Works with users to develop effective documentation</div><p style=\"margin:4px 0\">وبيشتغل مع المستخدمين على توثيق فعّال.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Programmers design, code, and remove syntactical errors from computer programs</div><p style=\"margin:4px 0\">المبرمجين بيصمموا ويكتبوا الكود ويصلحوا الأخطاء النحوية.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Document software with help files, procedure manuals, and Web sites with Frequently Asked Questions</div><p style=\"margin:4px 0\">التوثيق بيكون ملفات مساعدة ودلائل إجراءات ومواقع فيها الأسئلة الشائعة.</p></div><span class=\"lb\">الناتج Output:</span><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Computer programs</div><p style=\"margin:4px 0\">برامج الكمبيوتر.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">System documentation</div><p style=\"margin:4px 0\">توثيق النظام.</p></div><div style=\"background:#22409A;color:#fff;border-radius:10px;padding:8px 12px;margin-top:8px\"><b>ببساطة:</b> بنكتب الكود ونوثّق.</div></div><div class=\"box law\"><div class=\"hd\">6) التنفيذ: الاختبار والصيانة</div><div class=\"en\" style=\"margin-bottom:4px;opacity:.85\">Implementation phase: Testing and Maintaining the System · ص 26</div><p>بنتأكد إن النظام شغال صح.</p><span class=\"lb\">الأنشطة Activity:</span><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Test the information system</div><p style=\"margin:4px 0\">بنختبر النظام.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">System maintenance</div><p style=\"margin:4px 0\">بنعمل صيانة للنظام.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Maintenance documentation</div><p style=\"margin:4px 0\">بنوثّق الصيانة.</p></div><span class=\"lb\">الناتج Output:</span><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Problems, if any</div><p style=\"margin:4px 0\">المشاكل لو وُجدت.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Updated programs</div><p style=\"margin:4px 0\">برامج محدّثة.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Documentation</div><p style=\"margin:4px 0\">توثيق.</p></div><div style=\"background:#22409A;color:#fff;border-radius:10px;padding:8px 12px;margin-top:8px\"><b>ببساطة:</b> اختبار وصيانة وتوثيق.</div></div><div class=\"box law\"><div class=\"hd\">7) الصيانة: تطبيق النظام وتقييمه</div><div class=\"en\" style=\"margin-bottom:4px;opacity:.85\">Maintenance phase: Implementing and Evaluating the System · ص 27</div><p>بنسلّم النظام للمستخدمين ونقيّمه.</p><span class=\"lb\">الأنشطة Activity:</span><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Train users</div><p style=\"margin:4px 0\">بندرّب المستخدمين.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Analyst plans smooth conversion from old system to new system</div><p style=\"margin:4px 0\">المحلل بيخطط لانتقال سلس من النظام القديم للجديد.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Review and evaluate system</div><p style=\"margin:4px 0\">بنراجع النظام ونقيّمه.</p></div><span class=\"lb\">الناتج Output:</span><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Trained personnel</div><p style=\"margin:4px 0\">موظفين متدرّبين.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Installed system</div><p style=\"margin:4px 0\">نظام متركّب.</p></div><div style=\"background:#22409A;color:#fff;border-radius:10px;padding:8px 12px;margin-top:8px\"><b>ببساطة:</b> تدريب وانتقال وتقييم.</div></div><div class=\"box law\"><div class=\"hd\">أثر الصيانة</div><div class=\"en\" style=\"margin-bottom:4px;opacity:.85\">The Impact of Maintenance · ص 28</div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Maintenance is performed for two reasons:</div><p style=\"margin:4px 0\">الصيانة بتتعمل لسببين:</p></div><ul style=\"margin:4px 0;padding-inline-start:22px\"><li><bdi dir=\"ltr\">Removing software errors</bdi>: إصلاح أخطاء البرنامج</li><li><bdi dir=\"ltr\">Enhancing existing software</bdi>: تحسين البرنامج الموجود</li></ul><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Over time the cost of continued maintenance will be greater than that of creating an entirely new system.</div><p style=\"margin:4px 0\">مع الوقت تكلفة الصيانة المستمرة بتبقى أكبر من تكلفة نظام جديد خالص.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">At that point it becomes more feasible to perform a new systems study.</div><p style=\"margin:4px 0\">وساعتها الأحسن نعمل دراسة نظم جديدة.</p></div><div style=\"background:#22409A;color:#fff;border-radius:10px;padding:8px 12px;margin-top:8px\"><b>ببساطة:</b> لما الصيانة تغلى أكتر من نظام جديد، نعمل نظام جديد.</div></div><div class=\"box law\"><div class=\"hd\">مميزات وعيوب Waterfall</div><div class=\"en\" style=\"margin-bottom:4px;opacity:.85\">Pros and Cons of the Waterfall Method · ص 29</div><span class=\"lb\">الميزة Pros:</span><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Identifies systems requirements long time before programming begins</div><p style=\"margin:4px 0\">بنحدد المتطلبات بدري قبل ما البرمجة تبدأ.</p></div><span class=\"lb\">العيوب Cons:</span><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Design must be specified on paper before programming begins</div><p style=\"margin:4px 0\">التصميم لازم يتكتب على الورق بالكامل قبل ما البرمجة تبدأ.</p></div><div style=\"padding:8px 0;border-bottom:1px dashed #FFC72C\"><div class=\"en\" style=\"font-weight:600\">Long time between system proposal and delivery of new system</div><p style=\"margin:4px 0\">بياخد وقت طويل بين اقتراح النظام وتسليمه.</p></div><div class=\"ex\" style=\"margin-top:6px\">💡 زي الشلال: كل مرحلة بتنزل على اللي بعدها وصعب نرجع لورا.</div><div style=\"background:#22409A;color:#fff;border-radius:10px;padding:8px 12px;margin-top:8px\"><b>ببساطة:</b> ميزة واحدة وعيبين.</div></div>", "homework": {"mcq": [{"q": "Information Systems were automations of ______.", "o": ["random tasks", "hardware only", "well-defined processes", "user opinions"], "a": 2, "e": "نظم المعلومات هي أتمتة لعمليات واضحة ومحددة."}, {"q": "Which of the following is NOT a part of an information system?", "o": ["Software", "Networks", "People", "Advertising"], "a": 3, "e": "الأجزاء <bdi dir=\"ltr\">5</bdi>: <bdi dir=\"ltr\">Software</bdi> و<bdi dir=\"ltr\">Networks</bdi> و<bdi dir=\"ltr\">People</bdi> و<bdi dir=\"ltr\">Hardware</bdi> و<bdi dir=\"ltr\">Procedures</bdi>."}, {"q": "Which type of IS improves the productivity of individual users?", "o": ["Personal IS", "Group IS", "Enterprise IS", "Strategic IS"], "a": 0, "e": "<bdi dir=\"ltr\">Personal IS</bdi> بيخدم مستخدم واحد."}, {"q": "Which IS type supports collaboration among members of a workgroup?", "o": ["Personal IS", "Group IS", "Enterprise IS", "Operational IS"], "a": 1, "e": "<bdi dir=\"ltr\">Group IS</bdi> بيحسّن التواصل والتعاون جوه المجموعة."}, {"q": "Enterprise IS is used by organizations to:", "o": ["improve one user productivity only", "support a small workgroup only", "replace all employees", "define structured interactions among employees and external customers, suppliers and agencies"], "a": 3, "e": "<bdi dir=\"ltr\">Enterprise IS</bdi> للمؤسسة كلها ومعاها الأطراف الخارجية."}, {"q": "Transaction Processing Systems belong to which level?", "o": ["Strategic level", "Knowledge level", "Operational level", "Higher level"], "a": 2, "e": "<bdi dir=\"ltr\">TPS</bdi> في قاعدة الهرم، وهو المستوى التشغيلي."}, {"q": "ESS, GDSS and CSCWS belong to which level?", "o": ["Strategic level", "Operational level", "Knowledge level", "Higher level"], "a": 0, "e": "القمة هي المستوى الاستراتيجي."}, {"q": "Management Information Systems (MIS) belong to the:", "o": ["Operational level", "Higher level", "Strategic level", "Knowledge level"], "a": 1, "e": "<bdi dir=\"ltr\">MIS</bdi> و<bdi dir=\"ltr\">DSS</bdi> والـ <bdi dir=\"ltr\">Expert Systems</bdi> في مستوى <bdi dir=\"ltr\">Higher</bdi>."}, {"q": "Office Automation Systems belong to which level?", "o": ["Strategic level", "Higher level", "Knowledge level", "Operational level"], "a": 2, "e": "<bdi dir=\"ltr\">KWS</bdi> و<bdi dir=\"ltr\">OAS</bdi> في مستوى <bdi dir=\"ltr\">Knowledge</bdi>."}, {"q": "Which role analyzes the key business aspects and identifies how the system provides business value?", "o": ["Business analyst", "Systems analyst", "Infrastructure analyst", "Change management analyst"], "a": 0, "e": "ده <bdi dir=\"ltr\">Business analyst</bdi>، شغله القيمة والسياسات. صفحة <bdi dir=\"ltr\">18</bdi>."}, {"q": "Which role ensures that the system conforms to information systems standards?", "o": ["Business analyst", "Systems analyst", "Infrastructure analyst", "Change management analyst"], "a": 1, "e": "ده <bdi dir=\"ltr\">Systems analyst</bdi>، وبيصمم نظام المعلومات كمان. صفحة <bdi dir=\"ltr\">18</bdi>."}, {"q": "Which role identifies infrastructure changes needed to support the system?", "o": ["Business analyst", "Systems analyst", "Infrastructure analyst", "Change management analyst"], "a": 2, "e": "ده <bdi dir=\"ltr\">Infrastructure analyst</bdi>، شغله البنية التحتية. صفحة <bdi dir=\"ltr\">18</bdi>."}, {"q": "Which role develops and executes a user training plan?", "o": ["Business analyst", "Systems analyst", "Infrastructure analyst", "Change management analyst"], "a": 3, "e": "ده <bdi dir=\"ltr\">Change management analyst</bdi>، شغله التغيير والتدريب. صفحة <bdi dir=\"ltr\">18</bdi>."}, {"q": "Which role serves as the primary point of contact for the project?", "o": ["Business analyst", "Project manager", "Systems analyst", "Infrastructure analyst"], "a": 1, "e": "ده <bdi dir=\"ltr\">Project manager</bdi>. صفحة <bdi dir=\"ltr\">18</bdi>."}, {"q": "Managing the team of analysts, programmers and technical writers is the job of the:", "o": ["Project manager", "Business analyst", "Systems analyst", "Infrastructure analyst"], "a": 0, "e": "إدارة الفريق وتوزيع الموارد شغل الـ <bdi dir=\"ltr\">Project manager</bdi>."}, {"q": "SDLC stands for:", "o": ["System Design Logic Control", "Software Data Linking Cycle", "Systems Development Life Cycle", "Systems Deployment Local Chain"], "a": 2, "e": "<bdi dir=\"ltr\">SDLC</bdi> اختصار <bdi dir=\"ltr\">Systems Development Life Cycle</bdi>."}, {"q": "The correct order of the SDLC phases is:", "o": ["Analysis, Planning, Design, Maintenance, Implementation", "Planning, Analysis, Design, Implementation, Maintenance", "Planning, Design, Analysis, Implementation, Maintenance", "Design, Planning, Analysis, Implementation, Maintenance"], "a": 1, "e": "الترتيب: التخطيط ثم التحليل ثم التصميم ثم التنفيذ ثم الصيانة."}, {"q": "The output of the Planning phase is:", "o": ["A feasibility report", "Computer programs", "Trained personnel", "A model of the actual system"], "a": 0, "e": "ناتج التخطيط تقرير جدوى."}, {"q": "Which activity belongs to the Design phase?", "o": ["Interview user management", "Train users", "Prepare maintenance documentation", "Design the human-computer interface"], "a": 3, "e": "تصميم واجهة المستخدم من أنشطة مرحلة التصميم."}, {"q": "Maintenance is performed to:", "o": ["only train users", "design the database", "remove software errors and enhance existing software", "estimate project scope"], "a": 2, "e": "الصيانة لسببين: إصلاح الأخطاء وتحسين البرنامج."}], "essay": [{"q": "List the five information systems roles and state one responsibility of each role.", "a": "<ul class=\"en\" style=\"margin:4px 0\"><li>Business analyst: identifies how the system will provide business value.</li><li>Systems analyst: ensures the system conforms to information systems standards.</li><li>Infrastructure analyst: identifies infrastructure changes needed to support the system.</li><li>Change management analyst: develops and executes a user training plan.</li><li>Project manager: develops and monitors the project plan and assigns resources.</li></ul>"}, {"q": "Explain the three types of information systems.", "a": "<ul class=\"en\" style=\"margin:4px 0\"><li>Personal IS: improves the productivity of individual users.</li><li>Group IS: improves communications and supports collaboration among members of a workgroup.</li><li>Enterprise IS: used by organizations to define structured interactions among employees and external customers, suppliers, government agencies, etc.</li></ul>"}, {"q": "Name the phases of the waterfall SDLC, then give the activities and output of the Planning phase.", "a": "<ul class=\"en\" style=\"margin:4px 0\"><li>Phases: Planning, Analysis, Design, Implementation, Maintenance.</li><li>Planning activities: interviewing user management, summarizing the knowledge obtained, estimating the project scope, documenting the results.</li><li>Planning output: a feasibility report with problem definition and objective summaries, used by management to decide whether to proceed.</li></ul>"}]}, "review": "<div class=\"box law\"><div class=\"hd\">الأساسيات</div><div class=\"en\"><b>Information System, Types and Levels</b></div><ul class=\"en\" style=\"margin:4px 0\"><li>Parts: Software, Networks, People, Hardware, Procedures.</li><li>Types: Personal, Group, Enterprise.</li></ul><span class=\"lb\">الشرح:</span><ul style=\"margin:4px 0;padding-inline-start:22px\"><li>الأجزاء الخمسة والأنواع التلاتة بتتحفظ حرفيًا.</li></ul><div style=\"overflow-x:auto\"><table class=\"mini\" style=\"min-width:100%\"><tr><th>المستوى</th><th>الأنظمة</th></tr><tr><td><bdi dir=\"ltr\">Strategic</bdi></td><td dir=\"ltr\" style=\"text-align:left\">ESS, GDSS, CSCWS</td></tr><tr><td><bdi dir=\"ltr\">Higher</bdi></td><td dir=\"ltr\" style=\"text-align:left\">Expert Systems, DSS, MIS</td></tr><tr><td><bdi dir=\"ltr\">Knowledge</bdi></td><td dir=\"ltr\" style=\"text-align:left\">KWS, OAS</td></tr><tr><td><bdi dir=\"ltr\">Operational</bdi></td><td dir=\"ltr\" style=\"text-align:left\">TPS</td></tr></table></div></div><div class=\"box law\"><div class=\"hd\">⭐ مهم جدًا: الأدوار (صفحة 18)</div><div style=\"overflow-x:auto\"><table class=\"mini\" style=\"min-width:100%\"><tr><th>الدور</th><th>أهم مسؤولياته</th></tr><tr><td dir=\"ltr\" style=\"text-align:left\">Business analyst</td><td dir=\"ltr\" style=\"text-align:left\">Business value, new business processes and policies</td></tr><tr><td dir=\"ltr\" style=\"text-align:left\">Systems analyst</td><td dir=\"ltr\" style=\"text-align:left\">Technology improving processes, designing the IS, IS standards</td></tr><tr><td dir=\"ltr\" style=\"text-align:left\">Infrastructure analyst</td><td dir=\"ltr\" style=\"text-align:left\">Infrastructure changes and infrastructure standards</td></tr><tr><td dir=\"ltr\" style=\"text-align:left\">Change management analyst</td><td dir=\"ltr\" style=\"text-align:left\">Change management plan and user training plan</td></tr><tr><td dir=\"ltr\" style=\"text-align:left\">Project manager</td><td dir=\"ltr\" style=\"text-align:left\">Team, project plan, resources, primary contact</td></tr></table></div><p>لو السؤال فيه كلمة <bdi dir=\"ltr\">training</bdi> يبقى <bdi dir=\"ltr\">Change management</bdi>، وفيها <bdi dir=\"ltr\">standards</bdi> يبقى <bdi dir=\"ltr\">Systems</bdi> أو <bdi dir=\"ltr\">Infrastructure</bdi> حسب نوع المعيار، وفيها <bdi dir=\"ltr\">resources</bdi> أو <bdi dir=\"ltr\">team</bdi> يبقى <bdi dir=\"ltr\">Project manager</bdi>.</p></div><div class=\"box law\"><div class=\"hd\">مراحل SDLC: الأنشطة والنواتج</div><div style=\"overflow-x:auto\"><table class=\"mini\" style=\"min-width:100%\"><tr><th>Phase</th><th>Key activities</th><th>Output</th></tr><tr><td dir=\"ltr\" style=\"text-align:left\">Planning</td><td dir=\"ltr\" style=\"text-align:left\">Interview management, estimate scope, document results</td><td dir=\"ltr\" style=\"text-align:left\">Feasibility report</td></tr><tr><td dir=\"ltr\" style=\"text-align:left\">Analysis</td><td dir=\"ltr\" style=\"text-align:left\">Interviews, questionnaires, observation, prototyping, DFDs, data dictionary, system proposal</td><td dir=\"ltr\" style=\"text-align:left\">Understanding of the current system and a recommendation</td></tr><tr><td dir=\"ltr\" style=\"text-align:left\">Design</td><td dir=\"ltr\" style=\"text-align:left\">Data entry, human-computer interface, controls, database and files, backup</td><td dir=\"ltr\" style=\"text-align:left\">Model of the actual system</td></tr><tr><td dir=\"ltr\" style=\"text-align:left\">Implementation</td><td dir=\"ltr\" style=\"text-align:left\">Develop software, documentation, test, maintain</td><td dir=\"ltr\" style=\"text-align:left\">Computer programs, documentation, updated programs</td></tr><tr><td dir=\"ltr\" style=\"text-align:left\">Maintenance</td><td dir=\"ltr\" style=\"text-align:left\">Train users, conversion, review and evaluate</td><td dir=\"ltr\" style=\"text-align:left\">Trained personnel, installed system</td></tr></table></div><p>الترتيب: <bdi dir=\"ltr\">Planning</bdi> ثم <bdi dir=\"ltr\">Analysis</bdi> ثم <bdi dir=\"ltr\">Design</bdi> ثم <bdi dir=\"ltr\">Implementation</bdi> ثم <bdi dir=\"ltr\">Maintenance</bdi>، واسمها كمان <bdi dir=\"ltr\">Waterfall</bdi>.</p></div><div class=\"box law\"><div class=\"hd\">الصيانة وWaterfall</div><div class=\"en\"><b>Maintenance and Waterfall</b></div><ul class=\"en\" style=\"margin:4px 0\"><li>Maintenance: remove errors, enhance software; cost may exceed a new system, so do a new systems study.</li><li>Pro: requirements identified before programming.</li><li>Cons: design on paper first; long time before delivery.</li></ul><span class=\"lb\">الشرح:</span><ul style=\"margin:4px 0;padding-inline-start:22px\"><li>الصيانة لسببين، ولو تكلفتها زادت عن نظام جديد نعمل دراسة جديدة.</li><li>ميزة <bdi dir=\"ltr\">Waterfall</bdi> واحدة وعيبين.</li></ul></div><div class=\"box law\"><div class=\"hd\">أسئلة متوقعة في الامتحان</div><ul style=\"margin:4px 0;padding-inline-start:22px\"><li>مين الدور المسؤول عن كذا؟ من جدول صفحة <bdi dir=\"ltr\">18</bdi>.</li><li>عدّد أدوار نظم المعلومات واكتب مسؤولية كل واحد.</li><li>أنواع نظم المعلومات التلاتة.</li><li>الأنظمة في كل مستوى من الهرم.</li><li>مراحل <bdi dir=\"ltr\">SDLC</bdi> بالترتيب مع النواتج.</li><li>عيوب وميزات <bdi dir=\"ltr\">Waterfall</bdi>.</li><li>أسباب الصيانة وأثرها.</li></ul></div>", "reviewQuiz": {"mcq": [{"q": "Which is a part of an information system?", "o": ["Competition", "Procedures", "Advertising", "Rumors"], "a": 1, "e": "الأجزاء: <bdi dir=\"ltr\">Software</bdi> و<bdi dir=\"ltr\">Networks</bdi> و<bdi dir=\"ltr\">People</bdi> و<bdi dir=\"ltr\">Hardware</bdi> و<bdi dir=\"ltr\">Procedures</bdi>."}, {"q": "Executive Support Systems belong to which level?", "o": ["Strategic", "Operational", "Knowledge", "Higher"], "a": 0, "e": "<bdi dir=\"ltr\">ESS</bdi> في قمة الهرم."}, {"q": "Expert Systems and Decision Support Systems belong to the:", "o": ["Operational level", "Strategic level", "Higher level", "Knowledge level"], "a": 2, "e": "في مستوى <bdi dir=\"ltr\">Higher</bdi> مع <bdi dir=\"ltr\">MIS</bdi>."}, {"q": "Knowledge Work Systems belong to the:", "o": ["Strategic level", "Higher level", "Operational level", "Knowledge level"], "a": 3, "e": "<bdi dir=\"ltr\">KWS</bdi> مع <bdi dir=\"ltr\">OAS</bdi> في مستوى <bdi dir=\"ltr\">Knowledge</bdi>."}, {"q": "ERP stands for:", "o": ["Employee Resource Program", "Enterprise Resource Planning", "Electronic Records Processing", "Enterprise Report Planning"], "a": 1, "e": "<bdi dir=\"ltr\">ERP</bdi> هو <bdi dir=\"ltr\">Enterprise Resource Planning</bdi>."}, {"q": "Which role designs the information system and identifies how technology can improve business processes?", "o": ["Systems analyst", "Business analyst", "Infrastructure analyst", "Change management analyst"], "a": 0, "e": "ده <bdi dir=\"ltr\">Systems analyst</bdi>. صفحة <bdi dir=\"ltr\">18</bdi>."}, {"q": "Which role develops and executes a change management plan?", "o": ["Business analyst", "Systems analyst", "Change management analyst", "Infrastructure analyst"], "a": 2, "e": "ده <bdi dir=\"ltr\">Change management analyst</bdi>. صفحة <bdi dir=\"ltr\">18</bdi>."}, {"q": "Which role ensures the system conforms to infrastructure standards?", "o": ["Business analyst", "Systems analyst", "Change management analyst", "Infrastructure analyst"], "a": 3, "e": "ده <bdi dir=\"ltr\">Infrastructure analyst</bdi>. صفحة <bdi dir=\"ltr\">18</bdi>."}, {"q": "Which role assigns resources and develops and monitors the project plan?", "o": ["Business analyst", "Project manager", "Systems analyst", "Infrastructure analyst"], "a": 1, "e": "ده <bdi dir=\"ltr\">Project manager</bdi>. صفحة <bdi dir=\"ltr\">18</bdi>."}, {"q": "Which role identifies how the system will provide business value?", "o": ["Business analyst", "Systems analyst", "Infrastructure analyst", "Change management analyst"], "a": 0, "e": "ده <bdi dir=\"ltr\">Business analyst</bdi>. صفحة <bdi dir=\"ltr\">18</bdi>."}, {"q": "Interviewing, questionnaires and observing the decision maker belong to the:", "o": ["Planning phase", "Analysis phase", "Design phase", "Maintenance phase"], "a": 1, "e": "دي أنشطة جمع المعلومات في مرحلة التحليل."}, {"q": "Creating data flow diagrams and completing the data dictionary belong to the:", "o": ["Planning phase", "Design phase", "Implementation phase", "Analysis phase"], "a": 3, "e": "ده من تحليل احتياجات النظام."}, {"q": "Designing backup procedures and system controls is part of the:", "o": ["Planning phase", "Analysis phase", "Design phase", "Maintenance phase"], "a": 2, "e": "ده من أنشطة التصميم."}, {"q": "Which is a CON of the waterfall method?", "o": ["Long time between system proposal and delivery", "Requirements are identified early", "Requirements are identified before programming", "It needs no documentation"], "a": 0, "e": "من العيوب الوقت الطويل بين الاقتراح والتسليم."}, {"q": "When maintenance cost becomes greater than building a new system:", "o": ["maintenance should be doubled", "the old system is kept forever", "users are retrained only", "it becomes more feasible to perform a new systems study"], "a": 3, "e": "ساعتها الأفضل دراسة نظم جديدة."}], "essay": [{"q": "Explain the responsibilities of the Business analyst and the Systems analyst.", "a": "<ul class=\"en\" style=\"margin:4px 0\"><li>Business analyst: analyzes key business aspects, identifies how the system provides business value, designs new business processes and policies.</li><li>Systems analyst: identifies how technology can improve business processes, designs the new business processes and the information system, ensures the system conforms to information systems standards.</li></ul>"}, {"q": "Describe the Analysis phase of the SDLC: activities and output.", "a": "<ul class=\"en\" style=\"margin:4px 0\"><li>Determining human information requirements: interviewing, sampling hard data, questionnaires, observation, prototyping, learning the who, what, where, when, how and why of the current system.</li><li>Analyzing system needs: data flow, activity or sequence diagrams, data dictionary, structured decisions, system proposal.</li><li>Output: understanding of how users work, and a recommendation on what should be done.</li></ul>"}, {"q": "Describe the pyramid of information systems by managerial level and give examples.", "a": "<ul class=\"en\" style=\"margin:4px 0\"><li>Strategic: ESS, GDSS, CSCWS.</li><li>Higher: Expert Systems, Decision Support Systems, Management Information Systems.</li><li>Knowledge: Knowledge Work Systems, Office Automation Systems.</li><li>Operational: Transaction Processing Systems.</li></ul>"}, {"q": "Discuss the pros and cons of the waterfall method.", "a": "<ul class=\"en\" style=\"margin:4px 0\"><li>Pro: identifies systems requirements a long time before programming begins.</li><li>Con: design must be specified on paper before programming begins.</li><li>Con: long time between system proposal and delivery of the new system.</li></ul>"}, {"q": "Explain the impact of maintenance on an information system.", "a": "<ul class=\"en\" style=\"margin:4px 0\"><li>Maintenance is performed to remove software errors and to enhance existing software.</li><li>Over time, the cost of continued maintenance becomes greater than creating an entirely new system.</li><li>At that point it becomes more feasible to perform a new systems study.</li></ul>"}]}}]},

const app=document.getElementById('app');
const TABS=[["explain","١. الشرح"],["homework","٢. الواجب"],["review","٣. المراجعة"],["reviewQuiz","٤. حل المراجعة"]];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ORD=['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة','السابعة','الثامنة','التاسعة','العاشرة','الحادية عشرة','الثانية عشرة','الثالثة عشرة','الرابعة عشرة','الخامسة عشرة','السادسة عشرة'];
const L=['A','B','C','D','E'];

function route(){
  const p=location.hash.replace('#/','').split('/');
  window.scrollTo(0,0);
  if(p[0]==='s'&&SUBJECTS[+p[1]]){
    const s=SUBJECTS[+p[1]];
    if(p[2]==='l'&&s.lectures[+p[3]])return lecture(+p[1],+p[3],p[4]||'explain');
    return subject(+p[1]);
  }
  home();
}
function home(){
  app.innerHTML='<h2>اختر المادة</h2><div class="grid">'+SUBJECTS.map((s,i)=>
   `<button class="card" onclick="location.hash='#/s/${i}'"><span>${i+1}</span>${esc(s.name)}<small class="en" style="display:block;font-weight:400;text-align:center;font-size:.8rem">${esc(s.en)}</small></button>`).join('')+'</div>';
}
function subject(i){
  const s=SUBJECTS[i];
  let h=`<div class="crumb"><button class="btn alt" onclick="location.hash='#/'">← الرئيسية</button></div><h2>${esc(s.name)} <small class="en" style="display:block;font-weight:400;font-size:.85rem">${esc(s.en)}</small></h2>`;
  if(!s.lectures.length)h+='<div class="empty">لا توجد محاضرات بعد. ستظهر هنا بعد إضافتها.</div>';
  else h+='<table class="lt">'+s.lectures.map((l,j)=>`<tr><td>المحاضرة ${ORD[j]||(j+1)}</td><td><button class="btn" onclick="location.hash='#/s/${i}/l/${j}'">فتح</button></td></tr>`).join('')+'</table>';
  app.innerHTML=h;
}
function lecture(i,j,tab){
  const l=SUBJECTS[i].lectures[j],base=`#/s/${i}/l/${j}/`;
  app.innerHTML=`<div class="crumb"><button class="btn alt" onclick="location.hash='#/s/${i}'">← ${esc(SUBJECTS[i].name)}</button></div>
  <h2>${esc(l.title)}<small class="en" style="display:block;font-weight:400;font-size:.85rem">${esc(l.titleEn||'')}</small></h2><div class="tabs">${TABS.map(t=>`<button class="tab ${t[0]===tab?'on':''}" onclick="location.hash='${base}${t[0]}'">${t[1]}</button>`).join('')}</div><div id="body"></div>`;
  const b=document.getElementById('body'),d=l[tab];
  if(!d||(typeof d==='object'&&!(d.mcq&&d.mcq.length)&&!(d.essay&&d.essay.length))){b.innerHTML='<div class="empty">هذا القسم لم يُضَف بعد.</div>';return}
  if(typeof d==='string'){b.innerHTML='<div class="content">'+d+'</div>';tx(b,0)}
  else quiz(b,d);
}
function tx(el,n){if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([el]);else if(n<40)setTimeout(()=>tx(el,n+1),300)}
function quiz(el,q){
  const mcq=q.mcq||[],essay=q.essay||[];
  let h='';
  mcq.forEach((m,n)=>{h+=`<div class="box" id="m${n}"><b class="en">${n+1}. ${esc(m.q)}</b>`+m.o.map((o,k)=>
    `<label class="opt en"><input type="radio" name="m${n}" value="${k}"> ${L[k]}) ${esc(o)}</label>`).join('')+'<div class="fb"></div></div>'});
  essay.forEach((s,n)=>{h+=`<div class="box" id="e${n}"><b class="en">${esc(s.q)}</b><textarea class="en" placeholder="اكتب إجابتك هنا..."></textarea><div class="fb"></div></div>`});
  h+='<div id="res"></div><button class="btn" id="sub">تصحيح وعرض النتيجة</button>';
  el.innerHTML=h;tx(el,0);
  document.getElementById('sub').onclick=()=>{
    let score=0;
    mcq.forEach((m,n)=>{
      const box=document.getElementById('m'+n),pick=box.querySelector('input:checked'),v=pick?+pick.value:-1;
      box.querySelectorAll('input').forEach(x=>x.disabled=true);
      const opts=box.querySelectorAll('.opt');
      opts[m.a].classList.add('c');
      if(v===m.a){score++;box.classList.add('ok');box.querySelector('.fb').innerHTML='✅ إجابة صحيحة'+(m.e?'<br>'+m.e:'')}
      else{box.classList.add('bad');if(v>=0)opts[v].classList.add('w');
        box.querySelector('.fb').innerHTML=(v<0?'❌ لم تجب. ':'❌ إجابة خاطئة. ')+'الصحيح: <bdi dir="ltr">'+L[m.a]+'</bdi>'+(m.e?'<br>'+m.e:'')}
    });
    essay.forEach((s,n)=>{const box=document.getElementById('e'+n);box.querySelector('textarea').disabled=true;
      box.querySelector('.fb').innerHTML='<b>الإجابة النموذجية:</b><div class="en">'+s.a+'</div>'});
    const pct=mcq.length?Math.round(score/mcq.length*100):0;
    document.getElementById('res').innerHTML=`<div class="res">${mcq.length?`النتيجة: ${score} من ${mcq.length} (${pct}%)`:'قارن إجاباتك بالنموذجية'}${essay.length?'<br><small>الأسئلة المقالية: قارن إجابتك بالنموذجية بنفسك</small>':''}</div>`;
    document.getElementById('sub').outerHTML='<button class="btn alt" id="again">إعادة المحاولة</button>';
    document.getElementById('again').onclick=()=>quiz(el,q);
    tx(el,0);document.getElementById('res').scrollIntoView({behavior:'smooth'});
  };
}
addEventListener('hashchange',route);route();
</script>
