            <input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()} placeholder={`اكتب لـ${recipient}...`} style={{ flex: 1, padding: "10px 16px", borderRadius: 12, fontSize: "0.9rem", outline: "none", background: C.cream, color: C.ink, border: "none" }} />
            <button onClick={send} disabled={!input.trim()} style={{ padding: 10, borderRadius: 12, background: goldGradient, color: C.ink, border: "none", opacity: input.trim() ? 1 : 0.5 }}>
              <SendIcon size={18} />
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ============ Partner settings ============
function PartnerSettings({ user }) {
  const [partner, setPartner] = useState("");
  const [saved, setSaved] = useState(false);
  const [error, setError] = useState("");
  const [members, setMembers] = useState([]);
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    (async () => {
      const raw = await safeGet(`partner:${user.username}`, false);
      if (raw) setPartner(JSON.parse(raw).partner || "");
      const index = await getUserIndexWithIds();
      setMembers(index.map((u) => u.username));
    })();
  }, [user.username]);

  // بدون التحقق ده، حد ممكن يكتب اسم غلط بالغلط (أو اسم نفسه) ويحس إنه محمي
  // بصاحب متابعة وهو فعليًا مفيش حد هيوصله أي تنبيه لما يضغط "أنا في خطر".
  async function save() {
    setError("");
    setSaved(false);
    const trimmed = partner.trim();
    if (!trimmed) { setError("اكتب اسم صاحب المتابعة الأول."); return; }
    if (trimmed.toLowerCase() === user.username.trim().toLowerCase()) {
      setError("متقدرش تختار نفسك كصاحب متابعة — اختار حد تاني تثق فيه.");
      return;
    }
    const exists = members.some((m) => m.toLowerCase() === trimmed.toLowerCase());
    if (!exists) {
      setError("مفيش عضو مسجل بالاسم ده بالظبط. اتأكد من الاسم، أو اطلب منه يسجل الأول.");
      return;
    }
    setBusy(true);
    await safeSet(`partner:${user.username}`, JSON.stringify({ partner: trimmed }), false);
    setBusy(false);
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  }

  return (
    <div style={{ borderRadius: 16, padding: 20, ...cardStyle({ tint: C.ember, borderColor: C.ember, borderAlpha: "60", glow: "16" }) }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
        <IconBadge Icon={HandshakeIcon} tint={C.emberLight} />
        <h3 style={{ color: C.ink, fontWeight: 700, margin: 0, fontSize: "1.05rem", letterSpacing: "0.3px" }}>صاحب المتابعة بتاعك</h3>
      </div>
      <p style={{ color: C.inkDim, fontSize: "0.75rem", marginBottom: 16, lineHeight: 1.7 }}>اختار أخ تثق فيه ومسجل في المنصة. لما تدوس زرار "أنا في خطر"، هيوصله تنبيه فورًا يعرف إنك محتاج سند دلوقتي.</p>
      <div style={{ display: "flex", gap: 8 }}>
        <input value={partner} onChange={(e) => { setPartner(e.target.value); setError(""); }} placeholder="اسم صاحبك في المنصة" style={{ flex: 1, padding: "10px 16px", borderRadius: 12, fontSize: "0.9rem", outline: "none", background: C.cream, color: C.ink, border: "none" }} />
        <button onClick={save} disabled={busy} style={{ padding: "0 16px", borderRadius: 12, fontSize: "0.9rem", fontWeight: 700, background: goldGradient, color: C.ink, border: "none", opacity: busy ? 0.7 : 1 }}>{busy ? "..." : "حفظ"}</button>
      </div>
      {error && <p style={{ color: "#E8B4B4", fontSize: "0.75rem", marginTop: 8 }}>{error}</p>}
      {saved && <p style={{ color: C.gold, fontSize: "0.75rem", marginTop: 8 }}>اتحفظ ✓</p>}
    </div>
  );
}

// ============ Settings modal (رقم واحد لكل حاجة تخص حسابك) ============
function SettingsModal({ user, onClose, onAccountDeleted }) {
  const [open, setOpen] = useState(null); // null | "password" | "sheets" | "delete"

  // تغيير الباسورد
  const [oldPass, setOldPass] = useState("");
  const [newPass, setNewPass] = useState("");
  const [newPass2, setNewPass2] = useState("");
  const [pwBusy, setPwBusy] = useState(false);
  const [pwError, setPwError] = useState("");
  const [pwDone, setPwDone] = useState(false);

  // تخزين Google Sheets (ليدر بس)
  const [sheetsUrlInput, setSheetsUrlInput] = useState(() => getSheetsUrl());
  const [sheetsCustom, setSheetsCustom] = useState(() => isSheetsUsingCustom());
  const [sheetsBusy, setSheetsBusy] = useState(false);
  const [sheetsStatus, setSheetsStatus] = useState(null); // null | "checking" | "ok" | "fail"
  const [sheetsSaved, setSheetsSaved] = useState(false);
  const [appTokenInput, setAppTokenInput] = useState(() => getAppToken());

  // حذف الحساب
  const [typedName, setTypedName] = useState("");
  const [deleting, setDeleting] = useState(false);

  function toggle(section) {
    setOpen((o) => (o === section ? null : section));
    setPwError(""); setPwDone(false);
    setSheetsStatus(null); setSheetsSaved(false);
  }

  async function saveSheetsLink() {
    const url = sheetsUrlInput.trim();
    if (!url) return;
    setSheetsBusy(true);
    saveSheetsUrl(url);
    saveAppToken(appTokenInput);
    setSheetsCustom(true);
    setSheetsSaved(true);
    setSheetsBusy(false);
    setTimeout(() => setSheetsSaved(false), 2500);
  }

  function resetSheetsLink() {
    clearSheetsUrl();
    setSheetsUrlInput(DEFAULT_SHEETS_URL);
    setSheetsCustom(false);
    setSheetsSaved(false);
  }

  async function testSheetsConnection() {
    setSheetsStatus("checking");
    const status = await checkSharedStorageStatus();
    setSheetsStatus(status === "sheets" ? "ok" : "fail");
  }

  async function changePassword(e) {
    e.preventDefault();
    setPwError(""); setPwDone(false);
    if (!oldPass.trim() || !newPass.trim() || !newPass2.trim()) { setPwError("لازم تملأ الحقول التلاتة."); return; }
    if (newPass !== newPass2) { setPwError("كلمة المرور الجديدة والتأكيد مش متطابقين."); return; }
    if (newPass.trim().length < 6) { setPwError("كلمة المرور الجديدة لازم تكون 6 حروف/أرقام على الأقل."); return; }
    setPwBusy(true);
    const token = getAppToken();
    if (getSheetsUrl() && token) {
      try {
        const resp = await backendAuthCall("changePassword", {
          token,
          oldPassword: oldPass.trim(),
          newPassword: newPass.trim(),
        });
        if (resp && resp.ok) {
          setOldPass(""); setNewPass(""); setNewPass2("");
          setPwDone(true);
          setTimeout(() => setPwDone(false), 3000);
        } else if (resp && resp.error === "bad_old_password") {
          setPwError("كلمة المرور الحالية غلط.");
        } else if (resp && resp.error === "weak_password") {
          setPwError("كلمة المرور الجديدة لازم تكون 6 حروف/أرقام على الأقل.");
        } else {
          setPwError("حصلت مشكلة، جرب تاني.");
        }
      } catch {
        setPwError("حصلت مشكلة، جرب تاني.");
      } finally {
        setPwBusy(false);
      }
      return;
    }
    // ---- Fallback محلي (مفيش باك إند/جلسة متاحة) ----
    try {
      const key = usernameToKey(user.username);
      const raw = await safeGet(key, true);
      if (!raw) { setPwError("مش لاقي الحساب، جرب تعمل تسجيل خروج ودخول تاني."); setPwBusy(false); return; }
      const record = JSON.parse(raw);
      const { ok: oldOk } = await verifyAndMaybeUpgrade(oldPass.trim(), record);
      if (!oldOk) { setPwError("كلمة المرور الحالية غلط."); setPwBusy(false); return; }
      const salt = randomSaltHex();
      const passwordHash = await hashPassword(newPass.trim(), salt);
      const updated = { ...record, salt, passwordHash, hashVersion: HASH_VERSION };
      delete updated.password;
      const ok = await safeSet(key, JSON.stringify(updated), true);
      if (!ok) { setPwError("حصلت مشكلة في الحفظ، جرب تاني."); setPwBusy(false); return; }
      setOldPass(""); setNewPass(""); setNewPass2("");
      setPwDone(true);
      setTimeout(() => setPwDone(false), 3000);
    } catch {
      setPwError("حصلت مشكلة، جرب تاني.");
    } finally {
      setPwBusy(false);
    }
  }

  async function handleDeleteOwnAccount() {
    setDeleting(true);
    const key = usernameToKey(user.username);
    await deleteAccountByKey(key, user.username);
    onAccountDeleted();
  }

  const rowStyle = { display: "flex", alignItems: "center", justifyContent: "space-between", padding: "14px 16px", cursor: "pointer" };

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 50, display: "flex", alignItems: "center", justifyContent: "center", padding: "0 16px", background: "#000000cc" }}>
      <div dir="rtl" style={{ width: "100%", maxWidth: 440, borderRadius: 20, position: "relative", background: C.forest, border: `1px solid ${C.gold}66`, boxShadow: `0 0 60px ${C.gold}22`, maxHeight: "85vh", overflowY: "auto" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px 16px 12px", borderBottom: `1px solid ${C.goldDeep}33` }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <IconBadge Icon={SettingsIcon} tint={C.gold} />
            <h3 style={{ color: C.ink, fontWeight: 700, margin: 0, fontSize: "1.05rem", letterSpacing: "0.3px" }}>الإعدادات</h3>
          </div>
          <button onClick={onClose} style={{ background: "none", border: "none", color: C.inkDim }}>
            <XIcon size={20} />
          </button>
        </div>

        <div style={{ display: "flex", flexDirection: "column" }}>
          {/* صف تغيير الباسورد */}
          <div>
            <div onClick={() => toggle("password")} style={{ ...rowStyle, borderBottom: `1px solid ${C.goldDeep}22` }}>
              <span style={{ color: C.ink, fontSize: "0.9rem", fontWeight: 700 }}>تغيير كلمة المرور</span>
              <span style={{ color: C.inkDim, fontSize: "1rem" }}>{open === "password" ? "−" : "+"}</span>
            </div>
            {open === "password" && (
              <form onSubmit={changePassword} style={{ display: "flex", flexDirection: "column", gap: 10, padding: "12px 16px 18px", borderBottom: `1px solid ${C.goldDeep}22` }}>
                <PasswordField value={oldPass} onChange={(e) => setOldPass(e.target.value)} placeholder="كلمة المرور الحالية" style={{ width: "100%", padding: "10px 14px", borderRadius: 10, outline: "none", fontSize: "0.85rem", background: C.cream, color: C.ink, border: "none" }} />
                <PasswordField value={newPass} onChange={(e) => setNewPass(e.target.value)} placeholder="كلمة المرور الجديدة" style={{ width: "100%", padding: "10px 14px", borderRadius: 10, outline: "none", fontSize: "0.85rem", background: C.cream, color: C.ink, border: "none" }} />
                <PasswordField value={newPass2} onChange={(e) => setNewPass2(e.target.value)} placeholder="تأكيد كلمة المرور الجديدة" style={{ width: "100%", padding: "10px 14px", borderRadius: 10, outline: "none", fontSize: "0.85rem", background: C.cream, color: C.ink, border: "none" }} />
                {pwError && <p style={{ color: "#E8B4B4", fontSize: "0.75rem", margin: 0 }}>{pwError}</p>}
                {pwDone && <p style={{ color: C.gold, fontSize: "0.75rem", margin: 0 }}>اتغيرت ✓</p>}
                <button type="submit" disabled={pwBusy} style={{ padding: "10px 14px", borderRadius: 10, fontWeight: 700, fontSize: "0.85rem", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, background: goldGradient, color: C.ink, border: "none" }}>
                  {pwBusy && <LoaderIcon size={14} />}
                  حفظ كلمة المرور الجديدة
                </button>
              </form>
            )}
          </div>

          {/* صف تخزين Google Sheets — ليدر بس */}
          {user.isAdmin && (
            <div>
              <div onClick={() => toggle("sheets")} style={{ ...rowStyle, borderBottom: `1px solid ${C.goldDeep}22` }}>
                <span style={{ color: C.ink, fontSize: "0.9rem", fontWeight: 700 }}>تخزين البيانات (Google Sheets)</span>
                <span style={{ color: C.inkDim, fontSize: "1rem" }}>{open === "sheets" ? "−" : "+"}</span>
              </div>
              {open === "sheets" && (
                <div style={{ display: "flex", flexDirection: "column", gap: 10, padding: "12px 16px 18px", borderBottom: `1px solid ${C.goldDeep}22` }}>
                  <p style={{ color: C.inkDim, fontSize: "0.75rem", lineHeight: 1.7, margin: 0 }}>
                    المنصة بتخزن بيانات كل الأعضاء (حسابات، شات، عداد...) في Google Sheet واحد عن طريق رابط Apps Script. لو الرابط الحالي وقف عن الشغل، حط رابط جديد هنا.
                    {!sheetsCustom && " دلوقتي شغالة بالرابط الافتراضي المدمج في الملف."}
                  </p>
                  <input
                    value={sheetsUrlInput}
                    onChange={(e) => setSheetsUrlInput(e.target.value)}
                    placeholder="رابط Apps Script (.../exec)"
                    style={{ width: "100%", padding: "10px 14px", borderRadius: 10, outline: "none", fontSize: "0.8rem", background: C.cream, color: C.ink, border: "none", direction: "ltr", textAlign: "left" }}
                  />
                  <p style={{ color: C.inkDim, fontSize: "0.7rem", lineHeight: 1.7, margin: "6px 0 0" }}>
                    ده توكن جلستك الشخصية، بيتحط تلقائي أول ما تسجّل دخول، ومحدش غيرك شايفه. مش محتاج تلمسه غير في حالات نادرة (نقل جلسة يدويًا مثلًا).

                    <button onClick={testSheetsConnection} disabled={sheetsStatus === "checking"} style={{ flex: 1, padding: "9px 12px", borderRadius: 10, fontSize: "0.75rem", background: `${C.forestLight}88`, color: C.ink, border: `1px solid ${C.goldDeep}55` }}>

                      <button onClick={resetSheetsLink} style={{ flex: 1, padding: "9px 12px", borderRadius: 10, fontSize: "0.75rem", background: "transparent", color: C.inkDim, border: `1px solid ${C.goldDeep}55` }}>

                </div>

          {/* صف حذف الحساب */}
          <div>
            <div onClick={() => toggle("delete")} style={rowStyle}>
              <span style={{ color: "#E8B4B4", fontSize: "0.9rem", fontWeight: 700 }}>حذف الحساب</span>
              <span style={{ color: C.inkDim, fontSize: "1rem" }}>{open === "delete" ? "−" : "+"}</span>
            </div>

              <div style={{ padding: "0 16px 18px" }}>
                <p style={{ color: C.inkDim, fontSize: "0.75rem", lineHeight: 1.7, marginBottom: 10 }}>

                <p style={{ color: C.inkDim, fontSize: "0.75rem", margin: "0 0 6px" }}>اكتب اسمك "{user.username}" بالظبط للتأكيد:</p>

                <button onClick={handleDeleteOwnAccount} disabled={typedName.trim() !== user.username || deleting} style={{ width: "100%", padding: "10px 14px", borderRadius: 10, fontWeight: 700, fontSize: "0.8rem", background: "#7A1F1F", color: C.ink, border: "none", opacity: typedName.trim() === user.username ? 1 : 0.5 }}>

            )}
          </div>
        </div>
      </div>
    </div>
  );

// ============ Leader panel (owner-only control room) ============
function timeAgo(ms) {
  const diff = Date.now() - ms;
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return "دلوقتي";
  if (mins < 60) return `من ${mins} دقيقة`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `من ${hrs} ساعة`;
  return `من ${Math.floor(hrs / 24)} يوم`;
}

function LeaderPanel({ user }) {
  const [loading, setLoading] = useState(true);
  const [members, setMembers] = useState([]); // { username, key, lastSeen }
  const [blocked, setBlocked] = useState([]);
  const [allowedUsers, setAllowedUsers] = useState([]);
  const [restrictOn, setRestrictOn] = useState(false);
  const [busyKey, setBusyKey] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null); // key awaiting confirmation
  const [manualName, setManualName] = useState("");
  const [manualStatus, setManualStatus] = useState(null); // null | "checking" | "notfound" | "done"
  const [editingId, setEditingId] = useState(null); // key of member whose id is being edited
  const [editIdValue, setEditIdValue] = useState("");

  // بنستخدم ref بدل ما نعتمد على state "loading" جوه الفنكشن، عشان نفرّق بين
  // التحميل الأول (اللي فيه لازم نوّري "بيحمّل...") وريفريش الخلفية كل 15 ثانية
  // (اللي المفروض يحصل بهدوء من غير ما يخفي اللستة ويوريها تاني كل شوية).
  const isFirstLoadRef = useRef(true);
  const refresh = useCallback(async () => {
    if (isFirstLoadRef.current) setLoading(true);
    const index = await getUserIndexWithIds();
    // طلب شبكة واحد بس لكل نبضات الحضور، بدل ما نعمل طلب منفصل لكل عضو
    // (اللي كان بيبقى أبطأ وأبطأ كل ما عدد الأعضاء يزيد).
    const presenceMap = await getAllPresence();
    const withPresence = index.map((u) => {
      const t = Number(presenceMap[presenceKey(u.username)]);
      return { ...u, lastSeen: Number.isFinite(t) && t > 0 ? t : null };
    });
    setMembers(withPresence);
    const settings = await getChatSettings();
    setBlocked(settings.blocked);
    setAllowedUsers(settings.allowedUsers);
    setRestrictOn(settings.restrictEnabled);
    setLoading(false);
    isFirstLoadRef.current = false;
  }, []);

  useEffect(() => { refresh(); const id = setInterval(refresh, 15000); return () => clearInterval(id); }, [refresh]);

  const others = members.filter((m) => m.username !== user.username);
  const selfEntry = members.find((m) => m.username === user.username);
  const totalCount = others.length;
  const activeCount = others.filter((m) => m.lastSeen && Date.now() - m.lastSeen < PRESENCE_ACTIVE_MS).length;

  async function handleSaveId(m) {
    const n = Number(editIdValue.trim());
    if (!Number.isFinite(n) || n <= 0) return;
    setBusyKey("id:" + m.key);
    await overrideUserId(m.key, m.username, n);
    setEditingId(null);
    setBusyKey(null);
    refresh();
  }

  async function toggleMute(username) {
    setBusyKey("mute:" + username);
    const next = await updateChatSettings((s) => ({
      ...s,
      blocked: s.blocked.includes(username) ? s.blocked.filter((n) => n !== username) : [...s.blocked, username],
    }));
    setBlocked(next.blocked);
    setBusyKey(null);
  }

  async function deleteAccount(m) {
    setBusyKey("delete:" + m.key);
    await deleteAccountByKey(m.key, m.username);
    setConfirmDelete(null);
    setBusyKey(null);
    refresh();
  }

  // بيحذف أي حساب بالاسم، حتى لو اتعمل قبل ما لوحة القيادة تتضاف ومش ظاهر في اللستة تحت
  async function deleteByName() {
    const input = manualName.trim();
    if (!input) return;
    setManualStatus("checking");

    let key, name;
    if (/^\d+$/.test(input)) {
      // البحث بالرقم التسلسلي بتاع الحساب
      const index = await getUserIndexWithIds();
      const found = index.find((u) => String(u.id) === input);
      if (!found) {
        setManualStatus("notfound");
        setTimeout(() => setManualStatus(null), 2500);
        return;
      }
      key = found.key;
      name = found.username;
    } else {
      // ملحوظة: مش بنقدر نتأكد من وجود الحساب بقراءة سجله مباشرة (سجلات
      // اليوزرات محجوبة عن أي قراءة عامة عشان تحمي هاش الباسورد)، فبنتأكد
      // من فهرس اليوزرات العام (users:index) بدلًا من كده.
      key = usernameToKey(input);
      name = input;
      const index = await getUserIndexWithIds();
      const found = index.find((u) => u.key === key);
      if (!found) {
        setManualStatus("notfound");
        setTimeout(() => setManualStatus(null), 2500);
        return;
      }
    }

    if (!window.confirm(`متأكد إنك عايز تحذف حساب "${name}" نهائيًا؟`)) {
      setManualStatus(null);
      return;
    }
    await deleteAccount({ key, username: name });
    setManualName("");
    setManualStatus("done");
    setTimeout(() => setManualStatus(null), 2500);
  }

  async function toggleRestrict() {
    if (restrictOn) {
      // إطفاء التقييد: يرجع الشات الجماعي مفتوح للجميع فورًا. بنسيب لستة
      // الأعضاء المختارين زي ما هي (من غير ما نمسحها) عشان لو الليدر فعّل
      // التقييد تاني، يلاقي نفس الاختيار القديم من غير ما يعيده من الأول.
      await updateChatSettings((s) => ({ ...s, restrictEnabled: false }));
      setRestrictOn(false);
    } else {
      // تشغيل التقييد بيتفعّل على طول (حتى لو اللستة لسه فاضية)، عشان الزرار
      // مايوريش "مفعّل" وهو فعليًا لسه مفتوح للكل.
      await updateChatSettings((s) => ({ ...s, restrictEnabled: true }));
      setRestrictOn(true);
    }
  }

  async function toggleAllowedMember(username) {
    const list = allowedUsers.includes(username) ? allowedUsers.filter((n) => n !== username) : [...allowedUsers, username];
    await updateChatSettings((s) => ({ ...s, allowedUsers: list }));
    setAllowedUsers(list);
  }



  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", gap: 12 }}>
        <div style={{ flex: 1, borderRadius: 16, padding: 16, textAlign: "center", ...cardStyle({ tint: C.gold, borderAlpha: "80", glow: "26" }) }}>
          <p style={{ color: C.gold, fontSize: "1.8rem", fontWeight: 900, margin: 0 }}>{totalCount}</p>
          <p style={{ color: C.inkDim, fontSize: "0.7rem", margin: "4px 0 0" }}>إجمالي المسجلين</p>
        </div>
        <div style={{ flex: 1, borderRadius: 16, padding: 16, textAlign: "center", ...cardStyle({ tint: C.gold, borderAlpha: "80", glow: "26" }) }}>
          <p style={{ color: C.gold, fontSize: "1.8rem", fontWeight: 900, margin: 0 }}>{activeCount}</p>
          <p style={{ color: C.inkDim, fontSize: "0.7rem", margin: "4px 0 0" }}>نشطين دلوقتي</p>
        </div>
      </div>

      <div style={{ borderRadius: 16, padding: 16, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, ...cardStyle({ tint: C.gold, borderAlpha: "60", glow: "16" }) }}>
        <span style={{ color: C.inkDim, fontSize: "0.8rem" }}>رقمك أنت في المنصة</span>
        {editingId === "self" ? (
          <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <input
              value={editIdValue}
              onChange={(e) => setEditIdValue(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && selfEntry && handleSaveId(selfEntry)}
              autoFocus
              style={{ width: 54, padding: "4px 8px", borderRadius: 8, fontSize: "0.8rem", background: C.cream, color: C.ink, border: "none" }}
            />
            <button onClick={() => selfEntry && handleSaveId(selfEntry)} disabled={busyKey === "id:" + (selfEntry?.key)} style={{ background: "none", border: "none", color: C.gold, fontSize: "0.75rem", padding: 0 }}>حفظ</button>
            <button onClick={() => setEditingId(null)} style={{ background: "none", border: "none", color: C.inkDim, fontSize: "0.75rem", padding: 0 }}>إلغاء</button>
          </span>
        ) : (
          <span
            onClick={() => { setEditingId("self"); setEditIdValue(String((selfEntry?.id ?? user.id) || "")); }}
            title="دوس لتعديل رقمك"
            style={{ color: C.gold, fontWeight: 700, fontSize: "0.85rem", cursor: "pointer", textDecoration: "underline dotted" }}
          >
            #{selfEntry?.id ?? user.id ?? "—"}
          </span>
        )}
      </div>

      <div style={{ borderRadius: 16, padding: 16, ...cardStyle({ tint: C.gold, borderAlpha: "70", glow: "22" }) }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <IconBadge Icon={ShieldIcon} tint={C.gold} />
            <h3 style={{ color: C.ink, fontWeight: 700, margin: 0, fontSize: "1.05rem", letterSpacing: "0.3px" }}>تقييد الشات الجماعي</h3>
          </div>
          <button onClick={toggleRestrict} style={{ padding: "6px 14px", borderRadius: 8, fontSize: "0.75rem", fontWeight: 700, background: restrictOn ? goldGradient : `${C.forestLight}88`, color: restrictOn ? C.ink : C.inkDim, border: `1px solid ${C.goldDeep}55` }}>
            {restrictOn ? "مفعّل" : "مفتوح للكل"}
          </button>
        </div>
        <p style={{ color: C.inkDim, fontSize: "0.75rem", lineHeight: 1.7, margin: "0 0 10px" }}>
          {restrictOn ? "حدد تحت مين اللي يقدر يدخل ويكتب في الشات الجماعي. أي حد مش متعلّم عليه مش هيقدر يشوفه." : "الشات الجماعي مفتوح لكل الأعضاء المسجلين حاليًا."}
        </p>
        {restrictOn && allowedUsers.length === 0 && others.length > 0 && (
          <p style={{ color: "#E8B4B4", fontSize: "0.75rem", margin: "0 0 10px" }}>التقييد شغال دلوقتي ومحدش غيرك هيقدر يدخل الشات الجماعي لحد ما تختار عضو أو أكتر تحت.</p>
        )}
        {restrictOn && (
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            {others.length === 0 && <p style={{ color: C.inkDim, fontSize: "0.75rem" }}>لسه محدش اتسجل غيرك.</p>}
            {others.map((m) => {
              const isIn = allowedUsers.includes(m.username);
              return (
                <button key={m.key} onClick={() => toggleAllowedMember(m.username)} style={{ padding: "6px 12px", borderRadius: 8, fontSize: "0.75rem", background: isIn ? C.forestLight : "transparent", color: isIn ? C.ink : C.inkDim, border: `1px solid ${isIn ? C.gold : C.goldDeep + "55"}` }}>
                  {isIn ? "✓ " : ""}{m.username}
                </button>
              );
            })}
          </div>
        )}
      </div>

      <div style={{ borderRadius: 16, padding: 16, ...cardStyle({ tint: "#7A1F1F", borderColor: "#7A2E2E", borderAlpha: "88", glow: "0" }) }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
          <IconBadge Icon={BanIcon} tint="#E8B4B4" />
          <h3 style={{ color: "#E8B4B4", fontWeight: 700, margin: 0, fontSize: "1.05rem", letterSpacing: "0.3px" }}>حذف حساب بالاسم أو الرقم</h3>
        </div>
        <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
          <input value={manualName} onChange={(e) => setManualName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && deleteByName()} placeholder="اسم الحساب أو رقمه (#)" style={{ flex: 1, padding: "10px 16px", borderRadius: 12, fontSize: "0.85rem", outline: "none", background: C.cream, color: C.ink, border: "none" }} />
          <button onClick={deleteByName} disabled={manualStatus === "checking" || !manualName.trim()} style={{ padding: "0 16px", borderRadius: 12, fontSize: "0.85rem", fontWeight: 700, background: "#7A1F1F", color: C.ink, border: "none", opacity: !manualName.trim() ? 0.6 : 1 }}>
            حذف
          </button>
        </div>
        {manualStatus === "notfound" && <p style={{ color: "#E8B4B4", fontSize: "0.75rem", marginTop: 8 }}>مفيش حساب مسجل بالاسم ده.</p>}
        {manualStatus === "done" && <p style={{ color: C.gold, fontSize: "0.75rem", marginTop: 8 }}>اتحذف ✓</p>}
      </div>

      <div style={{ borderRadius: 16, padding: 16, ...cardStyle({ tint: C.gold, borderAlpha: "70", glow: "22" }) }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
          <IconBadge Icon={UsersIcon} tint={C.gold} />
          <h3 style={{ color: C.ink, fontWeight: 700, margin: 0, fontSize: "1.05rem", letterSpacing: "0.3px" }}>الأعضاء</h3>
        </div>
        {loading && <p style={{ color: C.inkDim, fontSize: "0.8rem" }}>بيحمّل...</p>}
        {!loading && others.length === 0 && <p style={{ color: C.inkDim, fontSize: "0.8rem" }}>لسه محدش اتسجل غيرك.</p>}
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {others.map((m) => {
            const isActive = m.lastSeen && Date.now() - m.lastSeen < PRESENCE_ACTIVE_MS;
            const isMuted = blocked.includes(m.username);
            return (
              <div key={m.key} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, padding: "8px 12px", borderRadius: 10, background: `${C.forestLight}55` }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0 }}>
                  <span style={{ width: 8, height: 8, borderRadius: 9999, flexShrink: 0, background: isActive ? "#7ee787" : C.creamDim + "55" }} />
                  <div style={{ minWidth: 0 }}>
                    <p style={{ color: C.ink, fontSize: "0.85rem", fontWeight: 700, margin: 0, display: "flex", alignItems: "center", gap: 6 }}>
                      {m.username}
                      {editingId === m.key ? (
                        <span style={{ display: "flex", alignItems: "center", gap: 4 }}>
                          <input
                            value={editIdValue}
                            onChange={(e) => setEditIdValue(e.target.value)}
                            onKeyDown={(e) => e.key === "Enter" && handleSaveId(m)}
                            autoFocus
                            style={{ width: 44, padding: "2px 6px", borderRadius: 6, fontSize: "0.7rem", background: C.cream, color: C.ink, border: "none" }}
                          />
                          <button onClick={() => handleSaveId(m)} disabled={busyKey === "id:" + m.key} style={{ background: "none", border: "none", color: C.gold, fontSize: "0.7rem", padding: 0 }}>حفظ</button>
                          <button onClick={() => setEditingId(null)} style={{ background: "none", border: "none", color: C.inkDim, fontSize: "0.7rem", padding: 0 }}>إلغاء</button>
                        </span>
                      ) : (
                        <span
                          onClick={() => { setEditingId(m.key); setEditIdValue(String(m.id || "")); }}
                          title="دوس لتعديل الرقم"
                          style={{ color: C.gold, fontWeight: 400, fontSize: "0.7rem", cursor: "pointer", textDecoration: "underline dotted" }}
                        >
                          #{m.id ?? "—"}
                        </span>
                      )}
                    </p>
                    <p style={{ color: C.inkDim, fontSize: "0.7rem", margin: 0 }}>{isActive ? "نشط الآن" : m.lastSeen ? `آخر ظهور ${timeAgo(m.lastSeen)}` : "لسه معملش دخول"}</p>
                  </div>
                </div>
                <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                  <button onClick={() => toggleMute(m.username)} disabled={busyKey === "mute:" + m.username} title={isMuted ? "فك الكتم" : "كتم من الشات الجماعي"} style={{ display: "flex", alignItems: "center", gap: 4, padding: "6px 10px", borderRadius: 8, fontSize: "0.7rem", background: isMuted ? "#7A2E2E" : C.forestLight, color: C.ink, border: "none" }}>
                    <BanIcon size={12} /> {isMuted ? "مكتوم" : "كتم"}
                  </button>
                  {confirmDelete === m.key ? (
                    <>
                      <button onClick={() => deleteAccount(m)} disabled={busyKey === "delete:" + m.key} style={{ padding: "6px 10px", borderRadius: 8, fontSize: "0.7rem", fontWeight: 700, background: "#7A1F1F", color: C.ink, border: "none" }}>
                        {busyKey === "delete:" + m.key ? "..." : "تأكيد الحذف"}
                      </button>
                      <button onClick={() => setConfirmDelete(null)} style={{ padding: "6px 10px", borderRadius: 8, fontSize: "0.7rem", background: "transparent", color: C.inkDim, border: `1px solid ${C.goldDeep}55` }}>
                        إلغاء
                      </button>
                    </>
                  ) : (
                    <button onClick={() => setConfirmDelete(m.key)} title="حذف الحساب نهائيًا" style={{ padding: "6px 10px", borderRadius: 8, fontSize: "0.7rem", background: "transparent", color: "#E8B4B4", border: `1px solid #7A2E2E` }}>
                      حذف
                    </button>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ============ Floating danger button ============
function FloatingDangerButton({ onClick }) {
  return (
    <button onClick={onClick} style={{
      position: "fixed", bottom: 22, left: "50%", transform: "translateX(-50%)", zIndex: 40,
      display: "flex", alignItems: "center", gap: 9,
      padding: "16px 30px", borderRadius: 9999, fontWeight: 900, fontSize: "0.95rem", letterSpacing: "0.3px",
      background: "linear-gradient(160deg, #b23434, #7A1F1F 70%)",
      color: C.ink,
      border: `2px solid ${C.gold}`,
      outline: `1px solid ${C.goldLight}55`,
      outlineOffset: 3,
      animation: "dangerPulse 3.4s ease-in-out infinite",
    }}>
      <AlertIcon size={18} />
      أنا في خطر
    </button>
  );
}

// ============ Danger modal ============
function DangerModal({ user, onClose }) {
  const [seconds, setSeconds] = useState(30);
  const [message] = useState(() => DANGER_MESSAGES[Math.floor(Math.random() * DANGER_MESSAGES.length)]);
  const [hasPartner, setHasPartner] = useState(true); // متفائل مبدئيًا، عشان الشاشة متبقاش فاضحة قبل ما تتحمل

  // بتبعت تنبيه لصاحب المتابعة في الخلفية من غير ما تقول للشخص اللي في خطر
  // إتبعتت الرسالة ولا لأ — هو بس بيشوف كلام دعم وتشجيع.
  useEffect(() => {
    (async () => {
      const raw = await safeGet(`partner:${user.username}`, false);
      const partner = raw ? JSON.parse(raw).partner : "";
      if (partner) {
        const ok = await sendDangerAlert(partner);
        if (!ok) {
          const inboxKey = `alerts:${partner.trim().toLowerCase()}`;
          const rawInbox = await safeGet(inboxKey, true);
          const list = rawInbox ? JSON.parse(rawInbox) : [];
          list.push({ from: user.username, time: Date.now() });
          await safeSet(inboxKey, JSON.stringify(list.slice(-50)), true);
        }
      } else {
        setHasPartner(false);
      }
    })();
  }, [user.username]);

  useEffect(() => {
    if (seconds <= 0) return;
    const id = setTimeout(() => setSeconds((s) => s - 1), 1000);
    return () => clearTimeout(id);
  }, [seconds]);

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 50, display: "flex", alignItems: "center", justifyContent: "center", padding: "0 16px", background: "#000000cc" }}>
      <div dir="rtl" style={{ width: "100%", maxWidth: 420, borderRadius: 24, padding: 28, position: "relative", textAlign: "center", background: C.forest, border: `1px solid ${C.gold}66`, boxShadow: `0 0 60px ${C.gold}33` }}>
        <button onClick={onClose} style={{ position: "absolute", top: 16, left: 16, background: "none", border: "none", color: C.inkDim }}>
          <XIcon size={20} />
        </button>

        <div style={{ margin: "0 auto 20px", display: "flex", alignItems: "center", justifyContent: "center", borderRadius: 9999, width: 90, height: 90, background: goldGradient, boxShadow: `0 0 30px ${C.gold}88` }}>
          <span style={{ color: C.ink, fontSize: "2rem", fontWeight: 900 }}>{seconds}</span>
        </div>

        <p style={{ color: C.ink, fontFamily: "'El Messiri', serif", fontSize: "1.1rem", lineHeight: 1.7, marginBottom: 16 }}>{message}</p>

        <p style={{ color: C.inkDim, fontSize: "0.75rem" }}>
          {hasPartner ? "إنت مش لوحدك في اللحظة دي. اتنفس وصمّم." : 'معندكش صاحب متابعة محفوظ — سجّل واحد من تبويب "صاحب المتابعة".'}
        </p>

        {seconds === 0 && (
          <button onClick={onClose} style={{ marginTop: 20, width: "100%", padding: 12, borderRadius: 12, fontWeight: 700, fontSize: "0.9rem", background: goldGradient, color: C.ink, border: "none" }}>
            صمدت. رجوع
          </button>
        )}
      </div>
    </div>
  );
}

// ============ Partner-in-danger alert (shown directly to the buddy) ============
function PartnerAlertModal({ alert, onClose }) {
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 60, display: "flex", alignItems: "center", justifyContent: "center", padding: "0 16px", background: "#000000cc" }}>
      <div dir="rtl" style={{ width: "100%", maxWidth: 420, borderRadius: 24, padding: 28, position: "relative", textAlign: "center", background: "#7A1F1F", border: `1px solid ${C.gold}66`, boxShadow: "0 0 60px #7A1F1F88" }}>
        <div style={{ margin: "0 auto 20px", display: "flex", alignItems: "center", justifyContent: "center", borderRadius: 9999, width: 78, height: 78, background: C.ink }}>
          <AlertIcon size={34} color="#7A1F1F" />
        </div>
        <h3 style={{ color: C.ink, fontFamily: "'El Messiri', serif", fontSize: "1.2rem", marginBottom: 12 }}>
          صاحبك {alert.from} في خطر دلوقتي
        </h3>
        <p style={{ color: "#F0DCC0", fontSize: "0.85rem", lineHeight: 1.7, marginBottom: 20 }}>
          كلمه دلوقتي لو تقدر. مكالمة أو رسالة بسيطة ممكن تفرق معاه في اللحظة دي.
        </p>
        <button onClick={onClose} style={{ width: "100%", padding: 12, borderRadius: 12, fontWeight: 700, fontSize: "0.9rem", background: goldGradient, color: C.ink, border: "none" }}>
          تمام، هكلمه
        </button>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
