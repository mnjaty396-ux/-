function cardStyle({ tint = C.forestLight, borderColor = C.goldDeep, borderAlpha = "40", glow = "16" } = {}) {
  return {
    background: `linear-gradient(160deg, ${tint}18, ${C.forest} 60%)`,
    border: `1px solid ${borderColor}${borderAlpha}`,
    boxShadow: `0 4px 14px #00000040`,
  };
}

// ============ Storage helpers ============
// أولوية التخزين: Google Sheets (لو الرابط شغال) ← localStorage (احتياطي على الجهاز بس).
const LS_PREFIX = "alam_yani:";
// اختصار للتجربة أثناء التطوير: لو الرابط فيه ?reset=1، بيتجاهل علامة "شاف
// الدخلة/الشرح قبل كده" المحفوظة على الجهاز، من غير ما يمسح أي بيانات تانية
// (حساب، سترييك، إلخ). مفيدة عشان تعيد تجربة الدخلة الدرامية من غير ما تمسح
// بيانات المتصفح كل مرة.
const FORCE_INTRO_RESET = (() => {
  try { return new URLSearchParams(window.location.search).get("reset") === "1"; } catch { return false; }
})();

// ---- Google Sheets (Apps Script) backend ----
// رابط جاهز مدمج في الملف، عشان أي حد يفتح الملف ده يشتغل معاه على طول
// من غير ما يحتاج يلصق أي رابط بنفسه.
const DEFAULT_SHEETS_URL = "https://script.google.com/macros/s/AKfycbyFOmb5yaVJzJn2bgMzUUJdUOc1yuM80bn0uhy_MU6MXzzvUPEGw_AGKXw106F13Rdxew/exec";
function getSheetsUrl() {
  try {
    const stored = localStorage.getItem(LS_PREFIX + "sheetsUrl");
    if (stored) return stored;
  } catch {}
  return DEFAULT_SHEETS_URL;
}
function saveSheetsUrl(url) {
  try { localStorage.setItem(LS_PREFIX + "sheetsUrl", url.trim()); return true; }
  catch { return false; }
}
function clearSheetsUrl() {
  try { localStorage.removeItem(LS_PREFIX + "sheetsUrl"); } catch {}
}
function isSheetsUsingCustom() {
  try { return !!localStorage.getItem(LS_PREFIX + "sheetsUrl"); } catch { return false; }
}
// ---- App/session token ----
// من غير توكن ثابت متضمّن جوه الملف (زي ما كان قبل كده). التوكن هنا شخصي
// ومؤقت وبيتاخد من الباك إند وقت تسجيل الدخول أو إنشاء الحساب (Code.gs،
// أكشن login/register)، ومحدش يقدر يشوفه غير صاحبه. من غير جلسة صالحة،
// الباك إند بيرفض أي كتابة/حذف، وبيرفض تمامًا قراءة سجلات اليوزرات
// (اللي فيها هاش الباسورد) حتى لو معاك توكن.
function getAppToken() {
  try { return localStorage.getItem(LS_PREFIX + "appToken") || ""; } catch { return ""; }
}
function saveAppToken(token) {
  try { localStorage.setItem(LS_PREFIX + "appToken", (token || "").trim()); return true; } catch { return false; }
}
function clearAppToken() {
  try { localStorage.removeItem(LS_PREFIX + "appToken"); } catch {}
}
async function sheetsGet(key) {
  const url = getSheetsUrl();
  if (!url) return null;
  try {
    const token = getAppToken();
    const tokenParam = token ? `&token=${encodeURIComponent(token)}` : "";
    const res = await fetch(`${url}?key=${encodeURIComponent(key)}${tokenParam}`);
    if (!res.ok) return null;
    const data = await res.json();
    if (data && data.error) return null;
    return data && data.value !== undefined && data.value !== "" ? data.value : null;
  } catch { return null; }
}
async function sheetsSet(key, value) {
  const url = getSheetsUrl();
  if (!url) return false;
  try {
    const token = getAppToken();
    const body = token ? { key, value, token } : { key, value };
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(body),
    });
    return res.ok;
  } catch { return false; }
}

// ============ فلتر السب والقذف: بيمنع إرسال الرسالة أصلاً لو فيها كلام
// مسيء، بدل ما تتبعت وتفضل معلّقة لحد ما الأدمن يشوفها ويحذفها يدوي. ============
// بنطبّع النص العربي الأول: نشيل التشكيل والتطويل، نوحّد صور الألف/الياء/
// التاء المربوطة، ونقلّل أي حرف متكرر لحرفين بحد أقصى — عشان نمسك محاولات
// التحايل البسيطة (زي "متناكـــه" أو "قحبهههه") من غير ما نبقى حساسين جدًا.
function normalizeArabicText(text) {
  return (text || "")
    .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g, "") // تشكيل
    .replace(/ـ+/g, "") // تطويل
    .replace(/[إأآا]/g, "ا")
    .replace(/ى/g, "ي")
    .replace(/ة/g, "ه")
    .replace(/(.)\1{2,}/g, "$1$1")
    .toLowerCase();
}

// جذور شائعة للسب والقذف (مش قائمة شاملة 100%، بس بتغطي أكتر الألفاظ
// المتداولة). بنطابقها كجزء من الكلمة بعد التطبيع عشان تمسك الاشتقاقات
// المختلفة (زي "يتناك"، "متناكه"، "بيتناك"...).
const PROFANITY_STEMS = [
  "متناك", "منيوك", "كسمك", "كسمي", "كسمه", "كسختك", "قحبه", "قحاب",
  "شرموط", "شراميط", "عاهر", "زبي", "زبك", "زبه", "خول", "لوطي",
  "قواد", "ديوث", "زاني", "عرص", "يلعنابو", "ابنالكلب", "ابنمتناكه",
  "كلبه", "حيوانه", "نجسه", "وسخه",
];

function containsProfanity(rawText) {
  const normalized = normalizeArabicText(rawText);
  // بنشيل أي مسافات أو علامات ترقيم كمان، عشان نمسك محاولة تفريق الحروف
  // بمسافات أو نقط زي "ك س م ك" أو "م.ت.ن.ا.ك".
  const compact = normalized.replace(/[^a-z0-9\u0600-\u06FF]/g, "");
  return PROFANITY_STEMS.some((stem) => compact.includes(stem));
}

// ============ Password hashing (Web Crypto, client-side) ============
// مش هاش بمستوى بيئة سيرفر حقيقية (ده محتاج باك إند فعلي)، لكنه أحسن بكتير من
// تخزين الباسورد نص عادي: كل يوزر ليه salt عشوائي خاص بيه، والهاش مبني على
// PBKDF2 بعدد تكرارات عالي عشان يبقى بطيء ومكلف على أي حد يحاول يجرب كل
// الاحتمالات (brute force) لو قدر يوصل للهاشات المخزّنة.
const HASH_VERSION = "pbkdf2v1";
const PBKDF2_ITERATIONS = 150000;
function randomSaltHex(len = 16) {
  const bytes = new Uint8Array(len);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
}
function hexToBytes(hex) {
  const bytes = new Uint8Array(hex.length / 2);
  for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
  return bytes;
}
async function hashPassword(password, saltHex, iterations = PBKDF2_ITERATIONS) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: hexToBytes(saltHex), iterations, hash: "SHA-256" },
    keyMaterial,
    256
  );
  return Array.from(new Uint8Array(bits), (b) => b.toString(16).padStart(2, "0")).join("");
}
async function verifyPassword(password, saltHex, expectedHash) {
  const hash = await hashPassword(password, saltHex);
  return hash === expectedHash;
}
// ---- Legacy scheme (SHA-256 هاش لفة واحدة بس)، محتفظين بيه عشان نتحقق من
// حسابات قديمة اتعملت قبل التحديث ونرقّيها؛ حسابات جديدة أو مرقّاة ماعادش
// بتستخدمه خالص.
async function legacySha256Hash(password, saltHex) {
  const enc = new TextEncoder();
  const data = enc.encode(saltHex + ":" + password);
  const digest = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(digest), (b) => b.toString(16).padStart(2, "0")).join("");
}
async function verifyLegacyPassword(password, saltHex, expectedHash) {
  const hash = await legacySha256Hash(password, saltHex);
  return hash === expectedHash;
}
// بتاخد ريكورد يوزر وباسورد اتكتب، وبترجع { ok, upgradedFields } — لو الباسورد
// صح بس الحساب لسه على نظام هاش قديم (أو نص عادي زمان)، upgradedFields بترجع
// جاهزة تتحفظ عشان نرقّي الحساب لـ PBKDF2 من غير ما نكرر نفس الكود في كل
// مكان بنتحقق فيه من باسورد.
async function verifyAndMaybeUpgrade(password, record) {
  if (record.hashVersion === HASH_VERSION && record.passwordHash && record.salt) {
    const ok = await verifyPassword(password, record.salt, record.passwordHash);
    return { ok, upgradedFields: null };
  }
  if (record.passwordHash && record.salt) {
    const ok = await verifyLegacyPassword(password, record.salt, record.passwordHash);
    if (!ok) return { ok: false, upgradedFields: null };
    const salt = randomSaltHex();
    const passwordHash = await hashPassword(password, salt);
    return { ok: true, upgradedFields: { salt, passwordHash, hashVersion: HASH_VERSION } };
  }
  if (record.password !== undefined) {
    const ok = record.password === password;
    if (!ok) return { ok: false, upgradedFields: null };
    const salt = randomSaltHex();
    const passwordHash = await hashPassword(password, salt);
    return { ok: true, upgradedFields: { salt, passwordHash, hashVersion: HASH_VERSION, password: undefined } };
  }
  return { ok: false, upgradedFields: null };
}

// اسم المستخدم "ليدر" محجوز لقائد المنصة — أول حد يسجل بيه بياخده.
const LEADER_USERNAME = "ليدر";

// ============ Leader password recovery (security questions) ============
// لو نسيت باسورد حساب "ليدر"، بيقدر يعيد ضبطه لو جاوب صح على الأسئلة دي.
// تنبيه أمني مهم: الأسئلة والإجابات لازم تتغيّر قبل ما توزّع الملف ده لحد،
// وميفضلوش حقائق شخصية حقيقية ممكن حد يعرفها أو يخمّنها (اسم جدة، مجموع
// الثانوية...). الإجابات هنا متخزنة كـ SHA-256 هاش (مش نص عادي) عشان محدش
// يقدر يشوفها بمجرد ما يفتح الكود (view-source)، لكن ده مش بديل عن اختيار
// أسئلة/إجابات صعب تتخمّن أو تتلاقى بالتخمين أو الهندسة الاجتماعية.
// لتوليد هاش إجابة جديدة: طبّع النص (نفس منطق normalizeAnswer) واعمل SHA-256
// له، أو استخدم لوحة القيادة لو أضفتلها واجهة لتغيير أسئلة الاسترجاع.
const LEADER_RECOVERY_QUESTIONS = [
  { q: "سادس اسم من اسم عيلتك؟", aHash: "4f127d6719ce2dcd941eee19e9285fe21a16966fb214fdb4f82f66c6b436c1b1" },
  { q: "جدتك من أمك اسمها إيه؟", aHash: "c6dfbf841fd5267b0af045c06c056434c2c55defbad3a3162ba1ac4f35384763" },
  { q: "جبت مجموع كام في الثانوية؟", aHash: "44c8031cb036a7350d8b9b8603af662a4b9cdbd2f96e8d5de5af435c9c35da69" },
];
function normalizeAnswer(s) {
  return String(s || "")
    .trim()
    .toLowerCase()
    .replace(/[أإآ]/g, "ا")
    .replace(/ى/g, "ي")
    .replace(/ة/g, "ه")
    .replace(/\s+/g, " ");
}
async function sha256Hex(text) {
  const enc = new TextEncoder();
  const digest = await crypto.subtle.digest("SHA-256", enc.encode(text));
  return Array.from(new Uint8Array(digest), (b) => b.toString(16).padStart(2, "0")).join("");
}
async function checkRecoveryAnswers(answers) {
  const results = await Promise.all(
    LEADER_RECOVERY_QUESTIONS.map(async (item, i) => (await sha256Hex(normalizeAnswer(answers[i]))) === item.aHash)
  );
  return results.every(Boolean);
}

// ============ User index (registry of all accounts, for the leader panel) ============
const USER_INDEX_KEY = "users:index";
const USER_ID_COUNTER_KEY = "users:idCounter";
async function getUserIndex() {
  const raw = await safeGet(USER_INDEX_KEY, true);
  try { return raw ? JSON.parse(raw) : []; } catch { return []; }
}
async function addToUserIndex(username, key, id) {
  const list = await getUserIndex();
  if (!list.some((u) => u.key === key)) {
    list.push({ username, key, id });
    await safeSet(USER_INDEX_KEY, JSON.stringify(list), true);
  }
}
async function removeFromUserIndex(key) {
  const list = await getUserIndex();
  const next = list.filter((u) => u.key !== key);
  await safeSet(USER_INDEX_KEY, JSON.stringify(next), true);
}
async function setUserIndexId(key, id) {
  const list = await getUserIndex();
  const idx = list.findIndex((u) => u.key === key);
  if (idx >= 0 && !list[idx].id) {
    list[idx].id = id;
    await safeSet(USER_INDEX_KEY, JSON.stringify(list), true);
  }
}
// بتغيّر رقم حساب معيّن يدويًا (مثلًا لو الترقيم جاله غلط بسبب تجربة/حذف حسابات
// قبل كده). بتحدّث اللستة وسجل الحساب نفسه، ومش بتلمس عداد الأرقام العام.
async function overrideUserId(key, username, newId) {
  const list = await getUserIndex();
  const idx = list.findIndex((u) => u.key === key);
  if (idx >= 0) {
    list[idx].id = newId;
    await safeSet(USER_INDEX_KEY, JSON.stringify(list), true);
  }
  const raw = await safeGet(key, true);
  if (raw) {
    try {
      const record = JSON.parse(raw);
      record.id = newId;
      await safeSet(key, JSON.stringify(record), true);
    } catch {}
  }
}
// بيمسح حساب بالكامل: بياناته، مكانه في اللستة، أي كتم/تقييد عليه، وباقي
// بياناته الشخصية (صاحب المتابعة، العداد). مستخدمة سواء الليدر بيحذف حد،
// أو أي حد بيحذف حسابه هو بنفسه.
async function deleteAccountByKey(key, username) {
  // حذف سجل اليوزر نفسه لازم يعدي من أكشن deleteAccount المحمي (بيتأكد من
  // السيرفر إن صاحب الطلب هو نفسه صاحب الحساب أو أدمن) — مسار الحذف العام
  // ماينفعش يلمس مفاتيح "users:*" أصلاً حتى لو معاك توكن صالح.
  const token = getAppToken();
  const url = getSheetsUrl();
  let deletedOnBackend = false;
  if (url && token) {
    try {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "deleteAccount", targetUsername: username, token }),
      });
      const data = await res.json();
      deletedOnBackend = !!(data && data.ok);
    } catch {}
  }
  if (!deletedOnBackend) await safeDelete(key); // fallback محلي (أوفلاين)
  await removeFromUserIndex(key);
  await updateChatSettings((s) => ({
    ...s,
    blocked: s.blocked.filter((n) => n !== username),
    allowedUsers: s.allowedUsers.filter((n) => n !== username),
  }));
  await safeDelete(`partner:${username}`);
  await safeDelete(streakKey(username));
  await removePresence(username);
}
// بيدي رقم تسلسلي جديد لأي حساب بيتعمل (أول واحد ياخد ١ وهكذا).
async function assignNextUserId() {
  const raw = await safeGet(USER_ID_COUNTER_KEY, true);
  const current = Number(raw) || 0;
  const next = current + 1;
  await safeSet(USER_ID_COUNTER_KEY, String(next), true);
  return next;
}
// بيدّي رقم لأي حساب قديم اتعمل قبل إضافة الأرقام التسلسلية، حسب ترتيب تسجيله
// (اللستة متخزنة بترتيب التسجيل أصلًا)، من غير ما يكرر رقم موجود.
async function getUserIndexWithIds() {
  const list = await getUserIndex();
  const counterRaw = await safeGet(USER_ID_COUNTER_KEY, true);
  let maxId = Number(counterRaw) || 0;
  list.forEach((u) => { if (u.id) maxId = Math.max(maxId, u.id); });
  let changed = false;
  for (const u of list) {
    if (!u.id) { maxId += 1; u.id = maxId; changed = true; }
  }
  if (changed) {
    await safeSet(USER_INDEX_KEY, JSON.stringify(list), true);
    await safeSet(USER_ID_COUNTER_KEY, String(maxId), true);
  }
  return list;
}

// ============ Presence (لمعرفة مين "نشط دلوقتي") ============
// ملحوظة أداء مهمة: بدل ما كل عضو يكون ليه "مفتاح" مستقل في التخزين ولوحة
// القيادة تضطر تعمل طلب شبكة منفصل لكل عضو عشان تعرف آخر ظهوره (يعني لو
// عندك ١٠٠ عضو، كانت هتبقى ١٠٠ طلب كل ١٥ ثانية بس عشان تفتح لوحة القيادة!
// وده كان بيبقى أبطأ وأبطأ كل ما عدد الأعضاء يزيد)، دلوقتي كل النبضات
// متخزنة سوا في مفتاح واحد مشترك، فقراءة "مين نشط دلوقتي" بقت طلب واحد
// بس مهما كان عدد الأعضاء.
const PRESENCE_ACTIVE_MS = 90 * 1000; // لو آخر نبضة من أقل من دقيقة ونص، يبقى "نشط الآن"
const PRESENCE_KEY = "presence:all";
function presenceKey(username) {
  return username.trim().toLowerCase();
}
async function getAllPresence() {
  const raw = await safeGet(PRESENCE_KEY, true);
  try {
    const parsed = raw ? JSON.parse(raw) : {};
    return parsed && typeof parsed === "object" ? parsed : {};
  } catch { return {}; }
}
async function reportPresence(username) {
  const map = await getAllPresence();
  map[presenceKey(username)] = Date.now();
  await safeSet(PRESENCE_KEY, JSON.stringify(map), true);
}
async function getLastSeen(username) {
  const map = await getAllPresence();
  const t = Number(map[presenceKey(username)]);
  return Number.isFinite(t) && t > 0 ? t : null;
}
async function removePresence(username) {
  const map = await getAllPresence();
  delete map[presenceKey(username)];
  await safeSet(PRESENCE_KEY, JSON.stringify(map), true);
}

// ============ Chat moderation settings (كتم، تقييد، اللستة المسموح لها) ============
// كانت الثلاثة دول متخزنين في 3 مفاتيح منفصلة، فأي حد فاتح الشات الجماعي كان
// بيعمل 3 طلبات شبكة كل 2.5 ثانية بس عشانهم (فوق طلب الرسايل نفسه). دلوقتي
// متجمّعين في مفتاح واحد، وبيتقروا بمعدل أبطأ بكتير من الرسايل لأنهم نادرًا
// ما بيتغيّروا (بس الليدر هو اللي بيغيّرهم).
const CHAT_SETTINGS_KEY = "chat:settings";
async function getChatSettings() {
  const raw = await safeGet(CHAT_SETTINGS_KEY, true);
  if (raw) {
    try {
      const parsed = JSON.parse(raw);
      return {
        blocked: Array.isArray(parsed.blocked) ? parsed.blocked : [],
        allowedUsers: Array.isArray(parsed.allowedUsers) ? parsed.allowedUsers : [],
        restrictEnabled: !!parsed.restrictEnabled,
      };
    } catch {}
  }
  // ترقية تلقائية من المفاتيح القديمة (لو موجودين من نسخة سابقة) لمرة واحدة بس،
  // عشان مانفقدش إعدادات الليدر المتخزنة قبل كده.
  const [rawBlocked, rawAllowed, rawRestrict] = await Promise.all([
    safeGet("chat:blocked", true),
    safeGet("chat:allowedUsers", true),
    safeGet("chat:restrictEnabled", true),
  ]);
  let blocked = [], allowedUsers = [];
  try { blocked = rawBlocked ? JSON.parse(rawBlocked) : []; } catch {}
  try { allowedUsers = rawAllowed ? JSON.parse(rawAllowed) : []; } catch {}
  const migrated = { blocked, allowedUsers, restrictEnabled: rawRestrict === "1" };
  if (rawBlocked || rawAllowed || rawRestrict) {
    await safeSet(CHAT_SETTINGS_KEY, JSON.stringify(migrated), true);
  }
  return migrated;
}
async function updateChatSettings(mutate) {
  const current = await getChatSettings();
  const next = mutate({ ...current });
  await safeSet(CHAT_SETTINGS_KEY, JSON.stringify(next), true);
  return next;
}

// ============ Daily streak counter (العداد اليومي) ============

const DAY_MS = 24 * 60 * 60 * 1000;
function streakKey(username) {
  return `streak:${username.trim().toLowerCase()}`;
}
async function getStreakData(username) {
  const raw = await safeGet(streakKey(username), true);
  try {
    const parsed = raw ? JSON.parse(raw) : null;
    if (parsed && parsed.startedAt) return parsed;
  } catch {}
  return null;
}
async function saveStreakData(username, data) {
  await safeSet(streakKey(username), JSON.stringify(data), true);
  return data;
}
async function ensureStreakData(username) {
  const existing = await getStreakData(username);
  if (existing) return existing;
  return saveStreakData(username, { startedAt: Date.now(), longestStreakDays: 0, resets: 0 });
}
function daysBetween(startedAt, now = Date.now()) {
  return Math.max(0, Math.floor((now - startedAt) / DAY_MS));
}
const STREAK_MILESTONES = [
  { days: 1, label: "أول يوم" },

// ============ True delete (removes the row from the backend, frees the username) ============
async function sheetsDelete(key) {
  const url = getSheetsUrl();
  if (!url) return false;
  try {
    const token = getAppToken();
    const body = token ? { action: "delete", key, token } : { action: "delete", key };
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(body),
    });
    if (!res.ok) return false;
    const data = await res.json().catch(() => null);
    return !!(data && data.ok);
  } catch { return false; }
}
async function safeDelete(key) {
  const ok = await sheetsDelete(key);
  if (ok) return true;
  try { localStorage.removeItem(LS_PREFIX + key); return true; } catch { return false; }
}

// ============ Button click sound (synthesized, no external audio file needed) ============
// صوت كليك واقعي قصير (ضجيج مفلتر زي زرار حقيقي) مش نغمة "بوينج" كرتونية.
// كل زرار بياخد لون صوت مختلف شوية (تردد الفلتر ومدة الصوت) حسب اسمه.
let clickAudioCtx = null;
function hashSeed(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = (h * 31 + str.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
function playClickSound(seedText = "") {
  try {
    if (!clickAudioCtx) clickAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (clickAudioCtx.state === "suspended") clickAudioCtx.resume();
    const ctx = clickAudioCtx;
    const seed = hashSeed(seedText);
    const t0 = ctx.currentTime;
    const dur = 0.018 + (seed % 14) / 1000; // ~18–32ms، قصير زي كليك حقيقي

    // ١) جسم الكليك: ضجيج قصير جدًا بيهبط بسرعة، مفلتر عشان يبقى "تك" مش "خشخشة"
    const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      const decay = Math.pow(1 - i / bufferSize, 4);
      data[i] = (Math.random() * 2 - 1) * decay;
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = 1400 + (seed % 2200); // 1400–3600Hz حسب الزرار
    filter.Q.value = 0.9 + ((seed >> 4) % 8) / 10;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.5, t0);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    noise.connect(filter).connect(noiseGain).connect(ctx.destination);

    // ٢) لمسة خفيفة جدًا من "ثقل" ميكانيكي تحت الكليك، عشان يحس إنه ملموس مش رقمي بحت
    const thock = ctx.createOscillator();
    const thockGain = ctx.createGain();
    thock.type = "sine";
    thock.frequency.setValueAtTime(120 + (seed % 60), t0);
    thockGain.gain.setValueAtTime(0.05, t0);
    thockGain.gain.exponentialRampToValueAtTime(0.001, t0 + dur * 0.9);
    thock.connect(thockGain).connect(ctx.destination);

    noise.start(t0);
    noise.stop(t0 + dur + 0.01);
    thock.start(t0);
    thock.stop(t0 + dur + 0.01);
  } catch {}
}
// بيسمع أي ضغطة على أي زرار في المنصة كلها، من غير ما نحتاج نلمس كل زرار لوحده
document.addEventListener("click", (e) => {
  const btn = e.target.closest && e.target.closest("button");
  if (btn && !btn.disabled) {
    const label = (btn.getAttribute("title") || btn.textContent || btn.id || "زرار").trim();
    playClickSound(label);
  }
}, true);

// ============ Root App ============
function App() {
  const [user, setUser] = useState(null);
  const [busy, setBusy] = useState(false);
  const [tab, setTab] = useState("streak");
  const [dangerOpen, setDangerOpen] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [partnerAlert, setPartnerAlert] = useState(null);
  // بيحدّد هل الزائر شاف الدخلة الدرامية وشرح المنصة قبل كده ولا لسه. متخزّنين
  // على الجهاز عشان ما يتكرروش عليه كل مرة يفتح فيها الصفحة بعد أول مرة.
  const [introDone, setIntroDone] = useState(() => {
    if (FORCE_INTRO_RESET) return false;
    try { return localStorage.getItem(LS_PREFIX + "introSeen") === "1"; } catch { return true; }
  });
  const [onboardingDone, setOnboardingDone] = useState(() => {
    if (FORCE_INTRO_RESET) return false;
    try { return localStorage.getItem(LS_PREFIX + "onboardingSeen") === "1"; } catch { return true; }
  });
  function finishIntro() {
    try { localStorage.setItem(LS_PREFIX + "introSeen", "1"); } catch {}
    setIntroDone(true);
  }
  function skipEverything() {
    try {
      localStorage.setItem(LS_PREFIX + "introSeen", "1");
      localStorage.setItem(LS_PREFIX + "onboardingSeen", "1");
    } catch {}
    setIntroDone(true);
    setOnboardingDone(true);
  }
  function finishOnboarding() {
    try { localStorage.setItem(LS_PREFIX + "onboardingSeen", "1"); } catch {}
    setOnboardingDone(true);
  }
  // بيتأكد لو فيه جلسة محفوظة على الجهاز من مرة تسجيل دخول قبل كده، وبيرجّع
  // المستخدم عليها من غير ما يحتاج يكتب اسمه وباسورده تاني. بيتحقق إن الحساب
  // لسه موجود فعليًا (مش محذوف) قبل ما يدخّله على طول.
  const [sessionChecked, setSessionChecked] = useState(false);
  useEffect(() => {
    (async () => {
      const saved = getSavedSession();
      if (saved) {
        const token = getAppToken();
        if (token) {
          // بنتأكد من الباك إند نفسه إن الجلسة لسه صالحة ومين صاحبها فعلاً
          // (isAdmin بيتحدد من السيرفر هنا، مش من البيانات المحفوظة محليًا).
          const who = await sheetsWhoAmI(token);
          if (who && who.ok) {
            const restored = { username: who.username, isAdmin: !!who.isAdmin, id: saved.id };
            setUser(restored);
            saveSession(restored);
          } else if (who && who.error === "unauthorized") {
            clearSession();
            clearAppToken();
          }
          // لو مفيش رد أصلاً (مفيش نت/باك إند مش متاح): نسيب الجلسة القديمة
          // شغالة بشكل مؤقت (وضع أوفلاين) لحد ما الاتصال يرجع.
          else {
            setUser(saved);
          }
        } else {
          // مفيش توكن جلسة محفوظ (حساب أوفلاين محلي بحت) — بنتحقق محليًا بس.
          try {
            const raw = localStorage.getItem(LS_PREFIX + usernameToKey(saved.username));
            if (raw) {
              const record = JSON.parse(raw);
              const restored = { username: record.username, isAdmin: !!record.isAdmin, id: record.id };
              setUser(restored);
              saveSession(restored);
            } else {
              clearSession();
            }
          } catch { clearSession(); }
        }
      }
      setSessionChecked(true);
    })();
  }, []);

  function handleLogin(u) {
    setUser(u);
    saveSession(u);
  }
  function handleLogout() {
    clearSession();
    clearAppToken();
    setUser(null);
  }

  // بيربط حساب المستخدم باشتراك OneSignal بتاعه عشان الإشعارات توصله بالتحديد
  useEffect(() => {
    if (!user || !user.username) return;
    if (typeof window.OneSignalDeferred === "undefined") return;
    window.OneSignalDeferred.push(async function (OneSignal) {
      try { await OneSignal.login(user.username.trim().toLowerCase()); } catch (e) {}
    });
  }, [user]);

  // بيراقب في الخلفية لو حد اختارك كـ"صاحب متابعة" له وضغط "أنا في خطر"،
  // وبيظهرله تنبيه مباشر — من غير ما الشخص اللي في خطر يعرف إن الرسالة وصلت أو لأ.
  useEffect(() => {
    if (!user) return;
    let cancelled = false;
    async function poll() {
      let list = await getMyAlerts();
      if (list === null) {
        const inboxKey = `alerts:${user.username.trim().toLowerCase()}`;
        const raw = await safeGet(inboxKey, true);
        list = raw ? JSON.parse(raw) : [];
      }
      let lastSeen = 0;
      try { lastSeen = Number(localStorage.getItem(LS_PREFIX + "lastSeenAlert:" + user.username.toLowerCase())) || 0; } catch {}
      const unseen = list.filter((a) => a.time > lastSeen);
      if (!cancelled && unseen.length > 0) {
        setPartnerAlert(unseen[unseen.length - 1]);
      }
    }
    poll();
    const id = setInterval(poll, 5000);
    return () => { cancelled = true; clearInterval(id); };
  }, [user]);

  function dismissPartnerAlert() {
    try { localStorage.setItem(LS_PREFIX + "lastSeenAlert:" + user.username.toLowerCase(), String(Date.now())); } catch {}
    setPartnerAlert(null);
  }

  // بيبعت "نبضة" كل شوية عشان لوحة القيادة تعرف مين نشط دلوقتي
  useEffect(() => {
    if (!user) return;
    reportPresence(user.username);
    const id = setInterval(() => reportPresence(user.username), 25000);
    return () => clearInterval(id);
  }, [user]);

  if (!sessionChecked) {
    return (
      <div dir="rtl" style={{ background: C.forestDark, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Cairo', sans-serif" }}>
        <ShieldMark size={44} />
      </div>
    );
  }

  if (!user && !introDone) return <IntroScreen onDone={finishIntro} onSkip={skipEverything} />;

  if (!user && !onboardingDone) return <OnboardingScreen onDone={finishOnboarding} />;

  if (!user) return <AuthScreen onLogin={handleLogin} busy={busy} setBusy={setBusy} />;

  return (
    <div dir="rtl" style={{ background: `radial-gradient(ellipse 900px 500px at 50% -10%, ${C.gold}1c, transparent 60%), radial-gradient(ellipse 700px 400px at 100% 100%, ${C.emberDeep}16, transparent 55%), ${C.forestDark}`, minHeight: "100vh", fontFamily: "'Cairo', sans-serif" }}>
      <div style={{ position: "relative", zIndex: 1 }}>
      <TopBar user={user} onLogout={handleLogout} onSettings={() => setSettingsOpen(true)} />
      <div style={{ maxWidth: 720, margin: "0 auto", padding: "16px 16px 96px" }}>
        <TabSwitcher tab={tab} setTab={setTab} isLeader={!!user.isAdmin} />
        {tab === "streak" && <DailyCounter user={user} />}
        {tab === "buddy" && <BuddyChat />}
        {tab === "group" && <GroupChat user={user} />}
        {tab === "dm" && <PrivateChat user={user} />}
        {tab === "partner" && <PartnerSettings user={user} />}
        {tab === "leader" && user.isAdmin && <LeaderPanel user={user} />}
      </div>
      <FloatingDangerButton onClick={() => setDangerOpen(true)} />
      {dangerOpen && <DangerModal user={user} onClose={() => setDangerOpen(false)} />}
      {settingsOpen && <SettingsModal user={user} onClose={() => setSettingsOpen(false)} onAccountDeleted={() => { setSettingsOpen(false); handleLogout(); }} />}
      {partnerAlert && <PartnerAlertModal alert={partnerAlert} onClose={dismissPartnerAlert} />}
      </div>
    </div>
  );
}

// بادچ صغير حوالين أيقونة عنوان أي قسم — دلوقتي شكله موحّد ومرتّب لكل الأقسام:
// خلفية دهب متدرّجة (أو دهب-دافئ للأقسام العمبر) واللون الغامق جوه، عشان
// الأيقونة تبان "بارزة" ومحفورة بدل ما تكون خط رفيع على خلفية مسطّحة.
function IconBadge({ Icon, size = 32, tint = C.gold }) {
  const isEmber = tint === C.emberLight || tint === C.ember;
  const isGoldFamily = tint === C.gold || tint === C.goldLight || tint === C.goldDeep;
  const fill = isEmber
    ? `linear-gradient(135deg, ${C.emberDeep} 0%, ${C.ember} 45%, ${C.emberLight} 100%)`
    : isGoldFamily
    ? `linear-gradient(135deg, ${C.goldDeep} 0%, ${C.gold} 45%, ${C.goldLight} 100%)`

  const glowColor = isEmber ? C.emberDeep : isGoldFamily ? C.goldDeep : tint;

    <div style={{

// زرار البداية. زرار "تخطي" ظاهر من أول ثانية لو حد مستعجل.
const INTRO_LINES = [
  { text: "في نص الليل...", duration: 3200 },
  { text: "لما الكل نايم، وإنت لسه صاحي، بتحارب حرب محدش شايفها.", duration: 5600 },
  { text: "تعبان من وعد بتقطعه لنفسك... وبتكسره تاني.", duration: 5400 },
  { text: "وحاسس إنك بتخيب ظن نفسك، وده إحساس تقيل جدًا تحمله لوحدك.", duration: 5800 },
  { text: "بس مفيش حد هنا هيحاسبك. إنت مش الوحيد اللي بيحس كده.", duration: 5600 },

function AuthScreen({ onLogin, busy, setBusy }) {
  const [mode, setMode] = useState("login"); // "login" | "signup"
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [forgotOpen, setForgotOpen] = useState(false);
  const [showForgotHint, setShowForgotHint] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    setError("");
    setShowForgotHint(false);
    const uname = username.trim();
    const pass = password.trim();
    if (!uname || !pass) { setError("لازم تكتب اسم وكلمة مرور."); return; }
    setBusy(true);
    const key = usernameToKey(uname);

    // بنجرب الباك إند الحقيقي الأول: الباسورد بيتحقق منه في السيرفر، ومش
    // بيتبعت أي هاش أو بيانات حساسة للمتصفح. لو ده اشتغل، منعملش أي حاجة
    // تانية محليًا خالص.
    if (getSheetsUrl()) {
      const resp = mode === "signup" ? await backendRegister(uname, pass) : await backendLogin(uname, pass);
      if (resp && resp.ok && resp.token) {
        saveAppToken(resp.token);
        setBusy(false);
        onLogin({ username: resp.username, isAdmin: !!resp.isAdmin, id: resp.id });
        return;
      }
      if (resp && resp.error === "exists") {
        setError("الاسم ده متسجل قبل كده. دوس \"تسجيل دخول\" بدل ما تعمل حساب جديد.");
        setBusy(false);
        return;
      }
      if (resp && resp.error === "not_found") {
        setError("الاسم ده مش متسجل. دوس \"إنشاء حساب\" عشان تعمل حساب جديد.");
        setBusy(false);
        return;
      }
      if (resp && resp.error === "bad_password") {
        const lockKey = LS_PREFIX + "loginLock:" + key;
        let lockState = { count: 0, lockedUntil: 0 };
        try { lockState = JSON.parse(localStorage.getItem(lockKey)) || lockState; } catch {}
        const nextCount = (lockState.count || 0) + 1;
        const nextLock = { count: nextCount, lockedUntil: nextCount >= 5 ? Date.now() + 2 * 60 * 1000 : 0 };
        try { localStorage.setItem(lockKey, JSON.stringify(nextLock)); } catch {}
        setError(nextCount >= 5 ? "محاولات كتير غلط. استنى دقيقتين وجرب تاني." : "كلمة المرور غلط. جرب تاني.");
        if (uname === LEADER_USERNAME) setShowForgotHint(true);
        setBusy(false);
        return;
      }
      if (resp && resp.error === "locked") {
        const waitMin = Math.max(1, Math.ceil((resp.retryAfterSeconds || 120) / 60));
        setError(`محاولات كتير غلط. استنى حوالي ${waitMin} دقيقة وجرب تاني.`);
        if (uname === LEADER_USERNAME) setShowForgotHint(true);
        setBusy(false);
        return;
      }
      // resp === null يعني مفيش اتصال بالباك إند خالص (مثلاً أوفلاين) —
      // في الحالة دي بس بنكمل على الوضع المحلي تحت كـ fallback.
      if (resp !== null) {
        setError("حصلت مشكلة في الاتصال بالباك إند، جرب تاني.");
        setBusy(false);
        return;
      }
    }

    // ---- Fallback: وضع محلي بحت (مفيش رابط باك إند أصلاً أو مفيش اتصال) ----
    try {
      const existing = await safeGet(key, true);

      if (mode === "signup") {
        if (existing) {
          setError("الاسم ده متسجل قبل كده. دوس \"تسجيل دخول\" بدل ما تعمل حساب جديد.");
          setBusy(false);
          return;
        }
        const isAdmin = uname === LEADER_USERNAME;
        const salt = randomSaltHex();
        const passwordHash = await hashPassword(pass, salt);
        const record = { username: uname, salt, passwordHash, hashVersion: HASH_VERSION, isAdmin };
        const ok = await safeSet(key, JSON.stringify(record), true);
        if (!ok) { setError("حصلت مشكلة في حفظ الحساب، جرب تاني."); setBusy(false); return; }
        const id = await assignNextUserId();
        record.id = id;
        await safeSet(key, JSON.stringify(record), true);
        await addToUserIndex(uname, key, id);
        setBusy(false);
        onLogin({ username: uname, isAdmin, id });
        return;
      }

      // mode === "login"
      if (!existing) {
        setError("الاسم ده مش متسجل. دوس \"إنشاء حساب\" عشان تعمل حساب جديد.");
        setBusy(false);
        return;
      }
      // حماية بسيطة (client-side) ضد محاولات تخمين الباسورد المتكررة من نفس
      // الجهاز: بعد 5 محاولات غلط بنقفل تسجيل الدخول لليوزر ده لمدة دقيقتين.
      // ده مش بديل عن حماية حقيقية على الباك إند (اللي المفروض يكون فيه rate
      // limiting هو كمان)، لكنه بيمنع أبسط محاولات التخمين اليدوية.
      const lockKey = LS_PREFIX + "loginLock:" + key;
      let lockState = { count: 0, lockedUntil: 0 };
      try { lockState = JSON.parse(localStorage.getItem(lockKey)) || lockState; } catch {}
      if (lockState.lockedUntil && Date.now() < lockState.lockedUntil) {
        const waitMin = Math.ceil((lockState.lockedUntil - Date.now()) / 60000);
        setError(`محاولات كتير غلط. استنى حوالي ${waitMin} دقيقة وجرب تاني.`);
        setBusy(false);
        return;
      }

      const record = JSON.parse(existing);
      // بيدعم حسابات قديمة اتعملت قبل إضافة الهاش (فيها password نص عادي أو
      // هاش SHA-256 بسيط لسه) وبيرقّيها لـ PBKDF2 أول ما صاحبها يعمل لوجين تاني.
      const { ok: passwordOk, upgradedFields } = await verifyAndMaybeUpgrade(pass, record);
      if (upgradedFields) {
        await safeSet(key, JSON.stringify({ ...record, ...upgradedFields }), true);
      }
      if (!passwordOk) {
        const nextCount = (lockState.count || 0) + 1;
        const nextLock = { count: nextCount, lockedUntil: nextCount >= 5 ? Date.now() + 2 * 60 * 1000 : 0 };
        try { localStorage.setItem(lockKey, JSON.stringify(nextLock)); } catch {}
        setError(nextCount >= 5 ? "محاولات كتير غلط. استنى دقيقتين وجرب تاني." : "كلمة المرور غلط. جرب تاني.");
        if (uname === LEADER_USERNAME) setShowForgotHint(true);
        setBusy(false);
        return;
      }
      try { localStorage.removeItem(lockKey); } catch {}
      let finalRecord = upgradedFields ? { ...record, ...upgradedFields } : record;
      if (!finalRecord.id) {
        const id = await assignNextUserId();
        finalRecord = { ...finalRecord, id };
        await safeSet(key, JSON.stringify(finalRecord), true);
        await setUserIndexId(key, id);
      }
      setBusy(false);
      onLogin({ username: finalRecord.username, isAdmin: !!finalRecord.isAdmin, id: finalRecord.id });
    } catch {
      setError("حصلت مشكلة في الاتصال بالتخزين، جرب تاني.");
      setBusy(false);
    }
  }

  const inputStyle = { width: "100%", padding: "12px 16px", borderRadius: 12, outline: "none", fontSize: "0.9rem", background: C.cream, color: C.ink, border: "none" };

  return (
    <div dir="rtl" style={{ background: `radial-gradient(ellipse 900px 500px at 50% -10%, ${C.gold}20, transparent 60%), radial-gradient(ellipse 700px 400px at 100% 100%, ${C.emberDeep}18, transparent 55%), ${C.forestDark}`, minHeight: "100vh", fontFamily: "'Cairo', sans-serif", display: "flex", alignItems: "center", justifyContent: "center", padding: "0 16px" }}>
      <div className="fade-in-up" style={{ position: "relative", zIndex: 1, width: "100%", maxWidth: 384, borderRadius: 24, overflow: "hidden", background: `linear-gradient(160deg, ${C.forestLight}2e, ${C.forest} 45%)`, border: `1px solid ${C.gold}77`, boxShadow: `0 20px 60px #000000aa, 0 0 50px ${C.gold}22, inset 0 1px 0 ${C.goldLight}26` }}>
        <div style={{ position: "absolute", inset: 0, zIndex: 1, background: `radial-gradient(ellipse 280px 220px at 50% 0%, ${C.gold}1c, transparent 65%)`, pointerEvents: "none" }} />
        <div style={{ position: "relative", zIndex: 2, padding: "32px" }}>
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", marginBottom: 8 }}>
          <ShieldMark size={72} />
          <h1 style={{ marginTop: 14, fontFamily: "'El Messiri', serif", color: C.gold, fontWeight: 700, fontSize: "1.9rem" }}>ألم يأن</h1>
          <OrnamentDivider color={C.gold} glyph="heart" />
          <p style={{ color: C.inkDim, fontSize: "0.85rem", marginTop: 0, textAlign: "center", lineHeight: 1.8 }}>بيت آمن لإخوة بيحاربوا نفس المعركة. مش هتصمد لوحدك — إنت هنا بين ناس فاهماك، وطريق انتصارك يبدأ من هنا.</p>
        </div>

        <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
          {[{ id: "login", label: "تسجيل دخول" }, { id: "signup", label: "إنشاء حساب" }].map((t) => {
            const active = mode === t.id;
            return (
              <button
                key={t.id}

                onClick={() => { setMode(t.id); setError(""); setShowForgotHint(false); }}
                style={{

                  background: active ? goldGradient : `${C.forestLight}88`,

  );

// ============ Forgot leader password (security questions) ============
function ForgotLeaderPassword({ onCancel, onLogin }) {
  const [answers, setAnswers] = useState(["", "", ""]);
  const [verified, setVerified] = useState(false);
  const [newPass, setNewPass] = useState("");
  const [newPass2, setNewPass2] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");

  const inputStyle = { width: "100%", padding: "12px 16px", borderRadius: 12, outline: "none", fontSize: "0.9rem", background: C.cream, color: C.ink, border: "none" };

  async function checkAnswers(e) {
    e.preventDefault();
    setError("");
    if (answers.some((a) => !a.trim())) { setError("جاوب على الأسئلة التلاتة."); return; }
    const ok = await checkRecoveryAnswers(answers);
    if (!ok) {
      setError("إجابة أو أكتر مش صح. جرب تاني.");
      return;
    }
    setVerified(true);
  }

  async function resetPassword(e) {
    e.preventDefault();
    setError("");
    if (!newPass.trim() || !newPass2.trim()) { setError("لازم تكتب كلمة المرور الجديدة وتأكيدها."); return; }
    if (newPass !== newPass2) { setError("كلمة المرور والتأكيد مش متطابقين."); return; }
    if (newPass.trim().length < 6) { setError("كلمة المرور لازم تكون 6 حروف/أرقام على الأقل."); return; }
    setBusy(true);

    if (getSheetsUrl()) {
      const resp = await backendRecoverLeader(answers, newPass.trim());
      if (resp && resp.ok && resp.token) {
        saveAppToken(resp.token);
        setBusy(false);
        onLogin({ username: resp.username, isAdmin: true, id: resp.id });
        return;
      }
      if (resp && resp.error === "wrong_answers") {
        setError("إجابة أو أكتر مش صح. جرب تاني.");
        setBusy(false);
        return;
      }
      if (resp !== null) {
        setError("حصلت مشكلة، جرب تاني.");
        setBusy(false);
        return;
      }
      // resp === null: مفيش اتصال بالباك إند، بنكمل على الوضع المحلي تحت.
    }

    try {
      const key = usernameToKey(LEADER_USERNAME);
      const raw = await safeGet(key, true);
      const salt = randomSaltHex();
      const passwordHash = await hashPassword(newPass.trim(), salt);
      if (!raw) {
        // مفيش حساب ليدر لسه — بننشئه دلوقتي كجزء من إعادة الضبط
        const id = await assignNextUserId();
        const record = { username: LEADER_USERNAME, salt, passwordHash, hashVersion: HASH_VERSION, isAdmin: true, id };
        await safeSet(key, JSON.stringify(record), true);
        await addToUserIndex(LEADER_USERNAME, key, id);
        setBusy(false);
        onLogin({ username: LEADER_USERNAME, isAdmin: true, id });
        return;
      } else {
        const record = JSON.parse(raw);
        const updated = { ...record, salt, passwordHash, hashVersion: HASH_VERSION, isAdmin: true };
        delete updated.password;
        await safeSet(key, JSON.stringify(updated), true);
        setBusy(false);
        onLogin({ username: LEADER_USERNAME, isAdmin: true, id: record.id });
      }
    } catch {
      setError("حصلت مشكلة، جرب تاني.");
      setBusy(false);
    }
  }

  if (verified) {
    return (
      <form onSubmit={resetPassword} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        <p style={{ color: C.gold, fontSize: "0.8rem", margin: 0 }}>الإجابات صح ✓ — دلوقتي حط باسورد جديد.</p>
        <PasswordField value={newPass} onChange={(e) => setNewPass(e.target.value)} placeholder="كلمة المرور الجديدة" style={inputStyle} />
        <PasswordField value={newPass2} onChange={(e) => setNewPass2(e.target.value)} placeholder="تأكيد كلمة المرور الجديدة" style={inputStyle} />
        {error && <p style={{ color: "#E8B4B4", fontSize: "0.75rem" }}>{error}</p>}
        <button type="submit" disabled={busy} style={{ width: "100%", padding: 12, borderRadius: 12, fontWeight: 700, fontSize: "0.9rem", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, background: goldGradient, color: C.ink, border: "none" }}>
          {busy && <LoaderIcon size={16} />}
          حفظ وادخل
        </button>
      </form>
    );
  }

  return (
    <form onSubmit={checkAnswers} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      {LEADER_RECOVERY_QUESTIONS.map((item, i) => (
        <div key={i}>
          <p style={{ color: C.inkDim, fontSize: "0.75rem", margin: "0 0 6px" }}>{item.q}</p>
          <input
            value={answers[i]}
            onChange={(e) => setAnswers((prev) => prev.map((a, idx) => (idx === i ? e.target.value : a)))}
            style={inputStyle}
          />
        </div>
      ))}
      {error && <p style={{ color: "#E8B4B4", fontSize: "0.75rem" }}>{error}</p>}
      <button type="submit" style={{ width: "100%", padding: 12, borderRadius: 12, fontWeight: 700, fontSize: "0.9rem", background: goldGradient, color: C.ink, border: "none" }}>
        تأكيد الإجابات
      </button>
      <button type="button" onClick={onCancel} style={{ background: "none", border: "none", color: C.inkDim, fontSize: "0.75rem", textAlign: "center", textDecoration: "underline", padding: 0 }}>
        رجوع لتسجيل الدخول
      </button>
    </form>
  );
}
// ============ Daily streak counter ============
function DailyCounter({ user }) {
  const [data, setData] = useState(null);
  const [now, setNow] = useState(Date.now());
  const [confirmReset, setConfirmReset] = useState(false);
  const [confirmFullReset, setConfirmFullReset] = useState(false);
  const [busy, setBusy] = useState(false);
  const [justReset, setJustReset] = useState(false);

  useEffect(() => {
    let cancelled = false;
    ensureStreakData(user.username).then((d) => { if (!cancelled) setData(d); });
    return () => { cancelled = true; };
  }, [user.username]);

  // بيحدّث العداد كل دقيقة عشان الساعات تتغير من غير ما تحتاج تعمل ريفريش للصفحة
  useEffect(() => {
    const id = setInterval(() => setNow(Date.now()), 60000);
    return () => clearInterval(id);
  }, []);

  if (!data) {
    return (
      <div style={{ borderRadius: 16, padding: 24, textAlign: "center", ...cardStyle({ tint: C.gold, borderAlpha: "60", glow: "18" }) }}>
        <p style={{ color: C.inkDim, fontSize: "0.85rem" }}>بيحمّل العداد...</p>
      </div>
    );
  }

  const diffMs = Math.max(0, now - data.startedAt);
  const days = Math.floor(diffMs / DAY_MS);
  const hours = Math.floor((diffMs % DAY_MS) / (60 * 60 * 1000));
  const longest = Math.max(data.longestStreakDays || 0, days);
  const nextMilestone = STREAK_MILESTONES.find((m) => m.days > days);
  const startedLabel = new Date(data.startedAt).toLocaleDateString("ar-EG", { year: "numeric", month: "long", day: "numeric" });

  async function handleReset() {
    setBusy(true);
    const updated = { startedAt: Date.now(), longestStreakDays: Math.max(data.longestStreakDays || 0, days), resets: (data.resets || 0) + 1 };
    await saveStreakData(user.username, updated);
    setData(updated);
    setConfirmReset(false);
    setBusy(false);
    setJustReset(true);
    setTimeout(() => setJustReset(false), 4000);
  }

  async function handleFullReset() {
    setBusy(true);
    const fresh = { startedAt: Date.now(), longestStreakDays: 0, resets: 0 };
    await saveStreakData(user.username, fresh);
    setData(fresh);
    setConfirmFullReset(false);
    setBusy(false);
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ borderRadius: 20, padding: "32px 20px", textAlign: "center", position: "relative", overflow: "hidden", ...cardStyle({ tint: C.gold, borderAlpha: "80", glow: "26" }) }}>
        <div style={{ position: "absolute", inset: 0, background: `radial-gradient(ellipse 260px 180px at 50% 0%, ${C.gold}22, transparent 70%)`, pointerEvents: "none" }} />
        <p style={{ color: C.inkDim, fontSize: "0.8rem", margin: "0 0 6px", position: "relative" }}>إنت صامد من</p>
        <div style={{ display: "flex", alignItems: "baseline", justifyContent: "center", gap: 8, position: "relative" }}>
          <span style={{ fontFamily: "'El Messiri', serif", fontSize: "4rem", fontWeight: 700, lineHeight: 1, color: C.gold }}>{days}</span>
          <span style={{ color: C.ink, fontSize: "1.2rem", fontWeight: 700 }}>يوم</span>
        </div>
        <p style={{ color: C.inkDim, fontSize: "0.75rem", margin: "6px 0 0", position: "relative" }}>و{hours} ساعة · بدأت من {startedLabel}</p>
        <p style={{ color: C.emberLight, fontSize: "0.72rem", margin: "10px 0 0", position: "relative" }}>كل يوم صعود حقيقي، مش كلام. وإخوانك في الدائرة بيتسلقوا معاك.</p>

        {nextMilestone ? (
          <div style={{ marginTop: 18, position: "relative" }}>
            <div style={{ height: 6, borderRadius: 9999, background: `${C.forestLight}55`, overflow: "hidden" }}>
              <div style={{ height: "100%", borderRadius: 9999, width: `${Math.min(100, (days / nextMilestone.days) * 100)}%`, background: goldGradient, transition: "width 0.4s ease" }} />
            </div>
            <p style={{ color: C.inkDim, fontSize: "0.7rem", marginTop: 6 }}>باقي {nextMilestone.days - days} يوم على "{nextMilestone.label}"</p>
          </div>
        ) : (
          <p style={{ color: C.gold, fontSize: "0.8rem", marginTop: 16, fontWeight: 700, position: "relative" }}>خلّصت كل المحطات المتاحة دلوقتي 🏆 استمر يا بطل</p>
        )}
      </div>

      <div style={{ display: "flex", gap: 12 }}>
        <div style={{ flex: 1, borderRadius: 16, padding: 16, textAlign: "center", ...cardStyle({ tint: C.gold, borderAlpha: "60", glow: "18" }) }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6, marginBottom: 4 }}>
            <TrophyIcon size={14} color={C.gold} />
            <span style={{ color: C.inkDim, fontSize: "0.7rem" }}>أطول فترة صمود</span>
          </div>
          <p style={{ color: C.ink, fontSize: "1.3rem", fontWeight: 900, margin: 0 }}>{longest} يوم</p>
        </div>
        <div style={{ flex: 1, borderRadius: 16, padding: 16, textAlign: "center", ...cardStyle({ tint: C.gold, borderAlpha: "60", glow: "18" }) }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6, marginBottom: 4 }}>
            <CalendarIcon size={14} color={C.gold} />
            <span style={{ color: C.inkDim, fontSize: "0.7rem" }}>مرات البداية من جديد</span>
          </div>
          <p style={{ color: C.ink, fontSize: "1.3rem", fontWeight: 900, margin: 0 }}>{data.resets || 0}</p>
        </div>
      </div>

      <div style={{ borderRadius: 16, padding: 16, ...cardStyle({ tint: C.forestLight, borderAlpha: "40", glow: "10" }) }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
          <IconBadge Icon={MountainIcon} tint={C.gold} />
          <h3 style={{ color: C.ink, fontWeight: 700, margin: 0, fontSize: "1.05rem", letterSpacing: "0.3px" }}>محطات الصعود</h3>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {STREAK_MILESTONES.map((m) => {
            const reached = days >= m.days;
            return (
              <div key={m.days} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "8px 12px", borderRadius: 10, background: reached ? `${C.gold}18` : `${C.forestLight}40`, border: `1px solid ${reached ? C.gold + "66" : C.goldDeep + "22"}` }}>
                <span style={{ color: reached ? C.gold : C.inkDim, fontSize: "0.8rem", fontWeight: reached ? 700 : 400 }}>{reached ? "✓ " : ""}{m.label}</span>
                <span style={{ color: C.inkDim, fontSize: "0.7rem" }}>{m.days} يوم</span>
              </div>
            );
          })}
        </div>
      </div>

      <div style={{ borderRadius: 16, padding: 16, textAlign: "center", ...cardStyle({ tint: C.forestLight, borderAlpha: "40", glow: "10" }) }}>
        {justReset ? (
          <p style={{ color: C.gold, fontSize: "0.85rem", margin: 0 }}>معلش، النهارده يوم واحد بس. العداد بدأ تاني دلوقتي — ابدأ من هنا. 🌱</p>
        ) : confirmReset ? (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <p style={{ color: C.inkDim, fontSize: "0.8rem", margin: 0 }}>متأكد؟ العداد هيرجع للصفر، بس رقمك الحالي ({days} يوم) هيتسجل كـ"أطول فترة" لو كان أعلى رقم وصلتله.</p>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={handleReset} disabled={busy} style={{ flex: 1, padding: "10px 14px", borderRadius: 10, fontWeight: 700, fontSize: "0.8rem", background: "#7A1F1F", color: C.ink, border: "none" }}>
                {busy ? "..." : "أيوه، ابدأ من جديد"}
              </button>
              <button onClick={() => setConfirmReset(false)} style={{ flex: 1, padding: "10px 14px", borderRadius: 10, fontSize: "0.8rem", background: "transparent", color: C.inkDim, border: `1px solid ${C.goldDeep}55` }}>
                لأ، رجّعني
              </button>
            </div>
          </div>
        ) : (
          <button onClick={() => setConfirmReset(true)} style={{ padding: "10px 20px", borderRadius: 10, fontSize: "0.8rem", background: "transparent", color: C.inkDim, border: `1px solid ${C.goldDeep}55` }}>
            وقعت النهارده — ابدأ العداد من جديد
          </button>
        )}
      </div>

      <div style={{ borderRadius: 16, padding: 16, textAlign: "center", ...cardStyle({ tint: "#7A1F1F", borderColor: "#7A2E2E", borderAlpha: "88", glow: "0" }) }}>
        {confirmFullReset ? (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <p style={{ color: "#E8B4B4", fontSize: "0.8rem", margin: 0, lineHeight: 1.6 }}>
              ده تصفير كامل: هيمسح رقم النهارده، وأطول فترة صمود ({longest} يوم)، وعدد مرات البداية من جديد ({data.resets || 0}). مفيش رجوع فيه.
            </p>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={handleFullReset} disabled={busy} style={{ flex: 1, padding: "10px 14px", borderRadius: 10, fontWeight: 700, fontSize: "0.8rem", background: "#7A1F1F", color: C.ink, border: "none" }}>
                {busy ? "..." : "أيوه، امسح كل حاجة"}
              </button>
              <button onClick={() => setConfirmFullReset(false)} style={{ flex: 1, padding: "10px 14px", borderRadius: 10, fontSize: "0.8rem", background: "transparent", color: C.inkDim, border: `1px solid ${C.goldDeep}55` }}>
                لأ، سيبها
              </button>
            </div>
          </div>
        ) : (
          <button onClick={() => setConfirmFullReset(true)} style={{ padding: "8px 16px", borderRadius: 10, fontSize: "0.75rem", background: "transparent", color: "#E8B4B4", border: `1px solid #7A2E2E` }}>
            تصفير كل حاجة في العداد (النهارده + الرقم القياسي + العداد)
          </button>
        )}
      </div>
    </div>
  );
}

function BuddyChat() {
  const [messages, setMessages] = useState([{ role: "assistant", text: "إزيك يا وحش، إيه الأخبار النهارده؟ عايز تتكلم في إيه؟" }]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [apiKeyMissing, setApiKeyMissing] = useState(() => !getApiKey());
  const [keyInput, setKeyInput] = useState("");
  const bottomRef = useRef(null);
  const prevCountRef = useRef(messages.length);
  const didMountRef = useRef(false);

  useEffect(() => {
    // منعمل سكرول تلقائي بس لو فعلاً اتضافت رسالة جديدة (مش أول مرة الصفحة بتفتح)،
    // عشان لما تدوس على "صاحبك" الشاشة متنزلش لتحت لوحدها.
    if (didMountRef.current && messages.length > prevCountRef.current) {
      bottomRef.current?.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
    didMountRef.current = true;
    prevCountRef.current = messages.length;
  }, [messages, loading]);

  function saveKey() {
    const trimmed = keyInput.trim();
    if (!trimmed) return;
    setApiKey(trimmed);
    setApiKeyMissing(false);
    setKeyInput("");
  }

  async function send() {
    const text = input.trim();
    if (!text || loading) return;
    const newMessages = [...messages, { role: "user", text }];
    setMessages(newMessages);
    setInput("");
    setLoading(true);

    try {
      const token = getAppToken();
      let reply = null;

      // الأول بنجرب بروكسي الباك إند: المفتاح مش موجود في المتصفح خالص هنا.
      if (getSheetsUrl() && token) {
        const resp = await backendAuthCall("aiChat", {
          token,
          systemPrompt: BUDDY_SYSTEM_PROMPT,
          messages: newMessages.map((m) => ({ role: m.role, text: m.text })),
        });
        if (resp && resp.ok) {
          reply = resp.reply || "معلش، حصل خطأ بسيط. جرب تاني.";
        } else if (resp && resp.error === "rate_limited") {
          setMessages((m) => [...m, { role: "assistant", text: "استنى شوية وجرب تاني، في ضغط على الخدمة دلوقتي." }]);
          setLoading(false);
          return;
        } else if (resp && resp.error && resp.error !== "no_key") {
          setMessages((m) => [...m, { role: "assistant", text: "حصل خطأ من السيرفر، جرب تاني كمان شوية." }]);
          setLoading(false);
          return;
        }
        // resp.error === "no_key" (الأدمن لسه مضفش مفتاح على السيرفر) أو resp === null
        // (مفيش اتصال) — بنكمل على المفتاح الشخصي المحلي تحت كـ fallback.
      }

      if (reply === null) {
        const apiKey = getApiKey();
        if (!apiKey) {
          setApiKeyMissing(true);
          setLoading(false);
          return;
        }
        const geminiContents = newMessages.map((m) => ({
          role: m.role === "assistant" ? "model" : "user",
          parts: [{ text: m.text }],
        }));
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${encodeURIComponent(apiKey)}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              system_instruction: { parts: [{ text: BUDDY_SYSTEM_PROMPT }] },
              contents: geminiContents,
            }),
          }
        );
        if (!response.ok) {
          let detail = "";
          try {
            const errData = await response.json();
            detail = errData?.error?.message || "";
          } catch {}
          setMessages((m) => [...m, { role: "assistant", text: `حصل خطأ من السيرفر (${response.status}).${detail ? " التفاصيل: " + detail : " اتأكد من المفتاح من زرار الإعدادات."}` }]);
          setLoading(false);
          return;
        }
        const data = await response.json();
        reply = data?.candidates?.[0]?.content?.parts?.[0]?.text || "معلش، حصل خطأ بسيط. جرب تاني.";
      }

      setMessages((m) => [...m, { role: "assistant", text: reply }]);
    } catch {
      setMessages((m) => [...m, { role: "assistant", text: "حصلت مشكلة في الاتصال، جرب تاني كمان شوية." }]);
    } finally {
      setLoading(false);
    }
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "14px 16px", borderRadius: 16, ...cardStyle({ tint: C.ember, borderColor: C.ember, borderAlpha: "55", glow: "14" }) }}>
        <IconBadge Icon={HandshakeIcon} tint={C.emberLight} />
        <div>
          <h3 style={{ color: C.ink, fontWeight: 700, margin: 0, fontSize: "1.05rem" }}>صاحبك</h3>
          <p style={{ color: C.inkDim, fontSize: "0.75rem", margin: "2px 0 0" }}>موجود يسمعك ويسندك في أي وقت، من غير حكم عليك.</p>
        </div>
      </div>
      <div style={{ borderRadius: 16, display: "flex", flexDirection: "column", ...cardStyle({ tint: C.forestLight, borderAlpha: "40" }), height: "58vh" }}>
      <div style={{ flex: 1, overflowY: "auto", padding: 16, display: "flex", flexDirection: "column", gap: 12 }}>
        {messages.map((m, i) => (
          <div key={i} style={{ maxWidth: "80%", padding: "10px 16px", borderRadius: 16, fontSize: "0.9rem", lineHeight: 1.6, alignSelf: m.role === "user" ? "flex-start" : "flex-end", background: m.role === "user" ? C.forestLight : goldGradient, color: m.role === "user" ? C.ink : C.ink, fontWeight: m.role === "assistant" ? 600 : 400 }}>
            {m.text}
          </div>
        ))}
        {loading && <div style={{ alignSelf: "flex-end", display: "flex", alignItems: "center", gap: 8, fontSize: "0.75rem", color: C.inkDim }}><LoaderIcon size={14} /> صاحبك بيكتب...</div>}
        <div ref={bottomRef} />
      </div>
      {apiKeyMissing ? (
        <div style={{ padding: 14, borderTop: `1px solid ${C.goldDeep}33`, display: "flex", flexDirection: "column", gap: 8 }}>
          <p style={{ color: C.inkDim, fontSize: "0.75rem", lineHeight: 1.7, margin: 0 }}>
            عشان صاحبك يرد عليك، محتاج تحط مفتاح Google Gemini API بتاعك (مجاني، من غير كارت). جيبه من <span style={{ color: C.gold }}>aistudio.google.com/apikey</span> وحطه هنا؛ بيتخزن على جهازك بس.
          </p>
          <div style={{ display: "flex", gap: 8 }}>
            <div style={{ flex: 1 }}>
              <PasswordField value={keyInput} onChange={(e) => setKeyInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && saveKey()} placeholder="AIza..." style={{ width: "100%", padding: "10px 16px", borderRadius: 12, fontSize: "0.85rem", outline: "none", background: C.cream, color: C.ink, border: "none" }} />
            </div>
            <button onClick={saveKey} style={{ padding: "0 16px", borderRadius: 12, fontWeight: 700, fontSize: "0.85rem", background: goldGradient, color: C.ink, border: "none" }}>حفظ</button>
          </div>
        </div>
      ) : (
        <div style={{ display: "flex", alignItems: "center", gap: 8, padding: 12, borderTop: `1px solid ${C.goldDeep}33` }}>
          <input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()} placeholder="اكتب اللي في دماغك..." style={{ flex: 1, padding: "10px 16px", borderRadius: 12, fontSize: "0.9rem", outline: "none", background: C.cream, color: C.ink, border: "none" }} />
          <button onClick={send} disabled={loading || !input.trim()} style={{ padding: 10, borderRadius: 12, background: goldGradient, color: C.ink, border: "none", opacity: (loading || !input.trim()) ? 0.6 : 1 }}>
            <SendIcon size={18} />

        </div>
      )}

    </div>
  );
}

// ============ Group chat ============
function GroupChat({ user }) {
  const [messages, setMessages] = useState([]);
  const [blocked, setBlocked] = useState([]);
  const [allowedUsers, setAllowedUsers] = useState([]);
  const [restrictEnabled, setRestrictEnabled] = useState(false);
  const [input, setInput] = useState("");
  const [filterNotice, setFilterNotice] = useState("");
  const bottomRef = useRef(null);
  const prevCountRef = useRef(0);

  const refresh = useCallback(async () => {
    const raw = await safeGet("chat:messages", true);
    const fetched = raw ? JSON.parse(raw) : [];
    // لو رسالة لسه ماوصلتش للتخزين المشترك (السند لسه شغال) وقت الريفريش ده،
    // منسيبهاش تختفي من الشاشة — نضمّها للستة الجايه من السيرفر لحد ما تتأكد فيها فعليًا.
    setMessages((prev) => {
      const fetchedIds = new Set(fetched.map((m) => `${m.time}|${m.user}|${m.text}`));
      const stillPending = prev.filter((m) => m.pending && !fetchedIds.has(`${m.time}|${m.user}|${m.text}`));
      return [...fetched, ...stillPending];
    });
  }, []);

  // إعدادات الكتم/التقييد نادرًا ما بتتغيّر (الليدر بس اللي بيغيّرها)، فمنسحبهاش
  // كل 2.5 ثانية زي الرسايل — بنكتفي بمعدل أبطأ بكتير (كل 15 ثانية) عشان نقلل
  // الطلبات من غير ما نأخر ظهور التغيير فترة طويلة لو حصل.
  const refreshSettings = useCallback(async () => {
    const s = await getChatSettings();
    setBlocked(s.blocked);
    setAllowedUsers(s.allowedUsers);
    setRestrictEnabled(s.restrictEnabled);
  }, []);

  useEffect(() => { refresh(); const id = setInterval(refresh, 2500); return () => clearInterval(id); }, [refresh]);
  useEffect(() => { refreshSettings(); const id = setInterval(refreshSettings, 15000); return () => clearInterval(id); }, [refreshSettings]);
  useEffect(() => {
    // بنعمل سكرول لتحت بس لو فعلاً زاد عدد الرسايل (رسالة جديدة وصلت)، مش كل مرة
    // الريفريش الدوري (كل 2.5 ثانية) بيجيب نفس الرسايل تاني — عشان كده كنا بنلاقي
    // الشاشة بتنزل لوحدها كل شوية حتى لو المستخدم طالع يقرا فوق.
    if (messages.length > prevCountRef.current) {
      bottomRef.current?.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
    prevCountRef.current = messages.length;
  }, [messages]);

  const isBlocked = blocked.includes(user.username);
  // التقييد بيتفعّل بمجرد ما الليدر يشغّله فعليًا (chat:restrictEnabled)، مش بس بوجود أعضاء
  // مختارين — عشان لو شغّله ولسه ماختارش حد، الشات يقفل فورًا (أأمن)، مش يفضل مفتوح غلط.
  const isRestricted = restrictEnabled && !user.isAdmin && !allowedUsers.includes(user.username);

  async function send() {
    const text = input.trim();
    if (!text || isBlocked) return;
    if (containsProfanity(text)) {
      setInput("");
      setFilterNotice("الرسالة اتشالت تلقائيًا لأنها فيها سب أو قذف. خلّي كلامك محترم في الدائرة 🙏");
      setTimeout(() => setFilterNotice(""), 4500);
      return;
    }
    const newMsg = { user: user.username, text, time: Date.now(), pending: true };
    setMessages((m) => [...m, newMsg]); // تظهر عندك فورًا من غير ما تستنى رد السيرفر
    setInput("");
    const ok = await chatSendMsg(text);
    if (!ok) {
      // fallback محلي (مفيش باك إند/جلسة) — نفس السلوك القديم، للاستخدام
      // الفردي على الجهاز نفسه بس، مش هيوصل لحد تاني.
      const raw = await safeGet("chat:messages", true);
      const list = raw ? JSON.parse(raw) : [];
      list.push({ user: newMsg.user, text: newMsg.text, time: newMsg.time });
      await safeSet("chat:messages", JSON.stringify(list.slice(-200)), true);
    }
    setMessages((m) => m.map((x) => (x === newMsg ? { ...x, pending: false } : x)));
  }

  async function deleteMessage(msg) {
    const ok = await chatDeleteMsg(msg.time, msg.user);
    if (!ok) {
      const raw = await safeGet("chat:messages", true);
      const list = raw ? JSON.parse(raw) : [];
      const next = list.filter((x) => !(x.time === msg.time && x.user === msg.user && x.text === msg.text));
      await safeSet("chat:messages", JSON.stringify(next), true);
    }
    refresh();
  }

  if (isRestricted) {
    return (
      <div style={{ borderRadius: 16, padding: 24, textAlign: "center", ...cardStyle({ tint: C.forestLight, borderAlpha: "40" }) }}>
        <p style={{ color: C.inkDim, fontSize: "0.85rem", lineHeight: 1.7 }}>الشات الجماعي دلوقتي مخصص لأعضاء معينين، ومش من ضمنهم. كلّم قائد المنصة لو محتاج توصل له.</p>
      </div>
    );
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "14px 16px", borderRadius: 16, ...cardStyle({ tint: C.ember, borderColor: C.ember, borderAlpha: "55", glow: "14" }) }}>
        <IconBadge Icon={CircleHandsIcon} tint={C.emberLight} />
        <div>
          <h3 style={{ color: C.ink, fontWeight: 700, margin: 0, fontSize: "1.05rem" }}>دائرة الإخوة</h3>
          <p style={{ color: C.inkDim, fontSize: "0.75rem", margin: "2px 0 0" }}>كل واحد هنا بيحارب نفس المعركة. إنت مش لوحدك.</p>
        </div>
      </div>
      <div style={{ borderRadius: 16, display: "flex", flexDirection: "column", ...cardStyle({ tint: C.goldDeep, borderAlpha: "55", glow: "18" }), height: "52vh" }}>
        <div style={{ flex: 1, overflowY: "auto", padding: 16, display: "flex", flexDirection: "column", gap: 10 }}>
          {messages.length === 0 && <p style={{ color: C.inkDim, fontSize: "0.9rem", textAlign: "center", marginTop: 24 }}>لسه مفيش رسايل، ابدأ إنت الأول.</p>}
          {messages.map((m, i) => (
            <div key={i} style={{ maxWidth: "80%", padding: "8px 14px", borderRadius: 12, fontSize: "0.9rem", alignSelf: m.user === user.username ? "flex-start" : "flex-end", background: m.user === user.username ? C.forestLight : `${C.creamDim}22`, color: C.ink, position: "relative" }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
                <span style={{ color: C.gold, fontWeight: 700, fontSize: "0.75rem" }}>{m.user}</span>
                {user.isAdmin && (
                  <button onClick={() => { if (window.confirm("تحذف الرسالة دي؟")) deleteMessage(m); }} title="حذف الرسالة" style={{ background: "none", border: "none", color: C.inkDim, padding: 0, display: "flex" }}>
                    <XIcon size={13} />
                  </button>
                )}
              </div>
              <p style={{ marginTop: 2, lineHeight: 1.6, margin: "2px 0 0", ...(containsProfanity(m.text) ? { color: C.inkDim, fontStyle: "italic" } : {}) }}>
                {containsProfanity(m.text) ? "[الرسالة اتشالت تلقائيًا لاحتوائها على سب أو قذف]" : m.text}
              </p>
            </div>
          ))}
          <div ref={bottomRef} />
        </div>
        {filterNotice && (
          <p style={{ margin: 0, padding: "8px 16px", fontSize: "0.75rem", color: "#F0DCC0", background: "#7A1F1F55", borderTop: `1px solid ${C.goldDeep}33`, textAlign: "center" }}>{filterNotice}</p>
        )}
        <div style={{ display: "flex", alignItems: "center", gap: 8, padding: 12, borderTop: `1px solid ${C.goldDeep}33` }}>
          <input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()} disabled={isBlocked} placeholder={isBlocked ? "الأدمن حظرك من الكتابة" : "اكتب رسالتك للجماعة..."} style={{ flex: 1, padding: "10px 16px", borderRadius: 12, fontSize: "0.9rem", outline: "none", background: C.cream, color: C.ink, border: "none", opacity: isBlocked ? 0.5 : 1 }} />
          <button onClick={send} disabled={isBlocked || !input.trim()} style={{ padding: 10, borderRadius: 12, background: goldGradient, color: C.ink, border: "none", opacity: (isBlocked || !input.trim()) ? 0.5 : 1 }}>
            <SendIcon size={18} />
          </button>
        </div>
      </div>
    </div>
  );
}

// ============ Private (one-to-one) messages between any two members ============
function dmKey(a, b) {
  const pair = [a.trim().toLowerCase(), b.trim().toLowerCase()].sort();
  return `dm:${pair[0]}__${pair[1]}`;
}

function PrivateChat({ user }) {

      const fetchedIds = new Set(fetched.map((m) => `${m.time}|${m.from}|${m.text}`));
